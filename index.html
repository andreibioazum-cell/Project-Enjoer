<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QWERTYLink Messenger</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #d1e7f5; color: #1e293b; margin: 0; padding: 0; }
        .message-in, .message-out { max-width: 80%; padding: 10px 16px; font-weight: 600; font-size: 14px; margin-bottom: 8px; word-break: break-word; }
        .message-in { 
            align-self: flex-start; background: #fff; border-radius: 18px 18px 18px 4px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;
        }
        .message-out { 
            align-self: flex-end; background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #fff; 
            border-radius: 18px 18px 4px 18px; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .screen { display: none; height: 100vh; width: 100%; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }
        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            box-shadow: 0 8px 16px -4px rgba(14, 165, 233, 0.4);
            transition: all 0.2s ease;
        }
        .btn-primary:active { transform: scale(0.96); }
        .card-shadow { box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.1); }
        .loader {
            border: 4px solid #f1f5f9; border-top-color: #0ea5e9; border-radius: 50%;
            width: 36px; height: 36px; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        input:focus { outline: none; }
        #app-interface { align-items: stretch; justify-content: flex-start; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- REGISTRATION -->
    <div id="reg-screen" class="screen active bg-slate-900/90 backdrop-blur-md p-4">
        <div class="bg-white w-full max-w-[340px] rounded-[40px] p-10 flex flex-col items-center card-shadow animate-in zoom-in duration-300">
            <div class="w-24 h-24 mb-6 shadow-2xl rounded-[32px] overflow-hidden border-4 border-sky-50 bg-slate-100 flex items-center justify-center">
                <img src="icon.jpeg" class="w-full h-full object-cover" onerror="this.style.display='none'">
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">QWERTYLink</h2>
            <p class="text-[11px] text-slate-400 mb-6 text-center font-bold tracking-wider uppercase">Введите никнейм</p>
            <input id="user-name-input" type="text" placeholder="Ник..." class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-4 outline-none mb-6 font-bold text-slate-700">
            <button id="save-name-btn" class="w-full btn-primary text-white font-black py-5 rounded-2xl active:scale-95 text-lg tracking-widest">
                Войти
            </button>
        </div>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen bg-sky-500/10 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-[380px] rounded-[48px] card-shadow overflow-hidden py-10 px-8 flex flex-col items-center border border-white/50 relative">
            <div class="w-24 h-24 mb-6 shadow-2xl rounded-[36px] overflow-hidden border-4 border-white bg-slate-100 flex items-center justify-center">
                <img src="icon.jpeg" class="w-full h-full object-cover" onerror="this.style.display='none'">
            </div>
            <h1 class="text-3xl font-black text-slate-900 mb-1 tracking-tight">QWERTYLink</h1>
            <p id="welcome-user" class="text-sky-500 font-black text-sm mb-4">загрузка...</p>
            <div class="flex flex-col items-center gap-2 mb-10">
                <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Ваш ID:</span>
                <p id="my-id-display" class="text-sky-600 font-black text-lg bg-sky-50 px-6 py-2 rounded-2xl shadow-sm border border-sky-100">....</p>
            </div>
            <div class="w-full space-y-6">
                <div class="flex flex-col gap-3">
                    <label class="text-[10px] font-black text-slate-400 ml-3 tracking-widest">Найти друга по ID</label>
                    <div class="flex bg-slate-50 rounded-3xl p-2.5 border-2 border-slate-100 transition-all shadow-inner">
                        <input id="main-search-input" type="text" placeholder="Введите ID друга..." class="flex-1 bg-transparent px-5 py-3 outline-none font-bold text-slate-800 w-full text-sm">
                        <button id="find-specific-btn" class="btn-primary text-white w-14 h-14 rounded-2xl flex items-center justify-center active:scale-90">
                            <i class="fas fa-search-plus text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="mt-12 text-center">
                <p class="text-[11px] text-slate-400 font-bold">Сделано Димой Густенёвым</p>
            </div>
        </div>
    </div>

    <!-- SEARCHING OVERLAY -->
    <div id="search-screen" class="screen bg-white/90 backdrop-blur-md z-[60] flex-col p-8">
        <div id="search-loading" class="flex flex-col items-center">
            <div class="loader mb-6"></div>
            <h2 class="text-2xl font-black text-sky-900 mb-2">Подключение...</h2>
            <p class="text-slate-400 font-bold text-sm text-center mb-8">Пытаемся установить прямую связь</p>
        </div>
        <div id="search-error" class="hidden flex-col items-center text-center">
            <div class="bg-red-50 border border-red-100 p-8 rounded-[32px] w-full max-w-xs mb-8">
                <p class="text-red-500 font-black text-lg mb-2">Не найден</p>
                <p class="text-slate-500 text-sm font-medium">Пользователь оффлайн или не существует.</p>
            </div>
        </div>
        <button id="cancel-search-btn" class="px-12 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black tracking-widest hover:bg-slate-200 transition-all active:scale-95">Назад</button>
    </div>

    <!-- CHAT INTERFACE -->
    <div id="app-interface" class="screen flex flex-col w-full h-screen bg-white relative">
        <header class="w-full p-4 border-b border-slate-100 flex items-center bg-white shadow-sm z-10">
            <button id="back-to-lobby" class="text-slate-500 p-2 mr-2"><i class="fas fa-chevron-left text-lg"></i></button>
            <div class="w-10 h-10 bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center mr-3">
                <img src="icon.jpeg" class="w-full h-full object-cover" onerror="this.style.display='none'">
            </div>
            <div class="flex-1">
                <h2 id="peer-display-name" class="font-black text-sm text-sky-950 leading-none mb-1">...</h2>
                <div class="flex items-center gap-1">
                    <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-[9px] text-green-600 font-bold tracking-wider">Прямой канал</span>
                </div>
            </div>
        </header>
        
        <div id="chat-box" class="flex-1 w-full overflow-y-auto p-4 flex flex-col scrollbar-hide bg-slate-50/50"></div>
        
        <form id="chat-form" class="w-full p-4 bg-white border-t border-slate-100 flex items-center gap-2 shadow-[0_-4px_12px_rgba(0,0,0,0.02)]">
            <button type="button" id="img-btn" class="w-11 h-11 bg-slate-50 rounded-xl flex items-center justify-center text-sky-500 border border-slate-100 transition-colors active:bg-sky-50"><i class="fas fa-image"></i></button>
            <input type="file" id="img-input" accept="image/*" class="hidden">
            <input id="chat-input" type="text" placeholder="Сообщение..." class="flex-1 bg-slate-50 rounded-xl px-4 py-3 outline-none border border-slate-100 font-semibold text-sm focus:bg-white focus:border-sky-200 transition-all">
            <button type="button" id="voice-btn" class="w-11 h-11 bg-slate-50 rounded-xl flex items-center justify-center text-red-500 border border-slate-100 transition-colors active:bg-red-50"><i class="fas fa-microphone"></i></button>
            <button type="submit" class="w-11 h-11 bg-sky-500 text-white rounded-xl flex items-center justify-center shadow-lg shadow-sky-100 active:scale-90 transition-all"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>

    <script>
        const iceServers = [
            { 'urls': 'stun:stun.l.google.com:19302' },
            { 'urls': 'stun:stun1.l.google.com:19302' },
            { 'urls': 'stun:stun2.l.google.com:19302' },
            { 'urls': 'stun:stun3.l.google.com:19302' }
        ];

        let myPeerId = '', userName = '', currentConn = null, encryptionKey = '', isSearching = false, isWaiting = false;
        
        const myShortCode = localStorage.getItem('qw_code_v55') || Math.random().toString(36).substring(2, 6).toUpperCase();
        localStorage.setItem('qw_code_v55', myShortCode);

        // PeerJS with fallback and better error handling
        const peer = new Peer(myShortCode, { debug: 1, secure: true, config: { iceServers } });

        const show = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const el = document.getElementById(id);
            if(el) el.classList.add('active');
        };

        const enterLobby = () => {
            document.getElementById('welcome-user').innerText = `Привет, ${userName}`;
            show('lobby-screen');
        };

        document.getElementById('save-name-btn').onclick = () => {
            const val = document.getElementById('user-name-input').value.trim();
            if (val.length < 2) return alert("Минимум 2 буквы");
            userName = val;
            if (peer.open) {
                enterLobby();
            } else {
                isWaiting = true;
                document.getElementById('save-name-btn').innerText = "Подключение...";
                // Re-attempt connection if disconnected
                if (peer.disconnected) peer.reconnect();
            }
        };

        peer.on('open', id => {
            myPeerId = id;
            document.getElementById('my-id-display').innerText = id;
            if (isWaiting) {
                isWaiting = false;
                enterLobby();
            }
        });

        peer.on('error', err => {
            console.error("PeerJS Error:", err.type);
            if (err.type === 'id-taken') {
                const nextId = Math.random().toString(36).substring(2, 6).toUpperCase();
                localStorage.setItem('qw_code_v55', nextId);
                location.reload();
            }
            if (isWaiting) {
                alert("Ошибка сети. Попробуйте обновить страницу или включить VPN.");
                document.getElementById('save-name-btn').innerText = "Войти";
                isWaiting = false;
            }
        });

        peer.on('error', err => {
            console.error("PeerJS Error:", err.type);
            if (err.type === 'peer-unavailable') {
                isSearching = false;
                document.getElementById('search-loading').classList.add('hidden');
                document.getElementById('search-error').classList.remove('hidden');
            }
            if (err.type === 'id-taken') {
                const newId = Math.random().toString(36).substring(2, 6).toUpperCase();
                localStorage.setItem('qw_code_v50', newId);
                location.reload();
            }
        });

        function executeSearch(target) {
            const targetCode = target.trim().toUpperCase();
            if (targetCode === myShortCode) return alert("Это ваш ID");
            
            isSearching = true;
            document.getElementById('search-error').classList.add('hidden');
            document.getElementById('search-loading').classList.remove('hidden');
            show('search-screen');

            // DIRECT CONNECT ATTEMPT
            const conn = peer.connect(targetCode, { 
                metadata: { name: userName },
                reliable: true
            });

            const failTimer = setTimeout(() => {
                if (isSearching && !conn.open) {
                    isSearching = false;
                    conn.close();
                    document.getElementById('search-loading').classList.add('hidden');
                    document.getElementById('search-error').classList.remove('hidden');
                }
            }, 10000);

            setupChat(conn, targetCode);
        }

        document.getElementById('find-specific-btn').onclick = () => {
            const val = document.getElementById('main-search-input').value.trim();
            if (val) executeSearch(val);
        };

        function setupChat(conn, name) {
            currentConn = conn;
            encryptionKey = [myShortCode, name].sort().join('_qw50_');

            conn.on('open', () => {
                isSearching = false;
                show('app-interface');
                document.getElementById('peer-display-name').innerText = conn.metadata?.name || name;
                document.getElementById('chat-box').innerHTML = '<div class="text-center text-slate-400 text-[10px] font-bold my-4">Безопасное соединение</div>';
            });

            conn.on('data', data => {
                if (data.encrypted) {
                    const dec = CryptoJS.AES.decrypt(data.content, encryptionKey).toString(CryptoJS.enc.Utf8);
                    if (dec) pushMsg(conn.metadata?.name || name, dec, 'in');
                } else pushMsg(conn.metadata?.name || name, data, 'in');
            });

            conn.on('close', () => show('lobby-screen'));
            conn.on('error', () => show('lobby-screen'));
        }

        peer.on('connection', conn => {
            setupChat(conn, conn.peer);
        });

        document.getElementById('chat-form').onsubmit = (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input'), text = input.value.trim();
            if (text && currentConn) {
                currentConn.send({ encrypted: true, content: CryptoJS.AES.encrypt(text, encryptionKey).toString() });
                pushMsg('Вы', text, 'out');
                input.value = '';
            }
        };

        function pushMsg(sender, data, side) {
            const box = document.getElementById('chat-box'), div = document.createElement('div');
            div.className = side === 'in' ? 'message-in' : 'message-out';
            if (typeof data === 'string') div.innerText = data;
            else if (data.type === 'image') {
                const img = document.createElement('img'); img.src = data.content;
                img.className = "rounded-lg max-w-full"; div.appendChild(img);
            }
            box.appendChild(div);
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        }

        const imgInp = document.getElementById('img-input');
        document.getElementById('img-btn').onclick = () => imgInp.click();
        imgInp.onchange = (e) => {
            const file = e.target.files[0];
            if (!file || !currentConn) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const payload = { type: 'image', content: ev.target.result };
                currentConn.send(payload);
                pushMsg('Вы', payload, 'out');
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('cancel-search-btn').onclick = () => { isSearching = false; show('lobby-screen'); };
        document.getElementById('back-to-lobby').onclick = () => { currentConn?.close(); show('lobby-screen'); };
        document.getElementById('disconnect-btn').onclick = () => currentConn?.close();
    </script>
</body>
</html>
