name: JsAI Quantum Engine - Fixed Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project Structure
        run: |
          mkdir -p app/src/main/java/com/jsai/quantum
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. settings.gradle (ИСПРАВЛЕННЫЙ: теперь репозитории видны всем)
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "JsAIQuantum"
          include ':app'
          EOF

          # 2. build.gradle (Root)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          EOF

          # 3. app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.jsai.quantum'
              compileSdk 34
              defaultConfig {
                  applicationId "com.jsai.quantum"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "Quantum-1.5"
                  multiDexEnabled true
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 4. Strings & Themes
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">JsAI Quantum</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.JsAI" parent="Theme.AppCompat.NoActionBar">
          <item name="android:windowBackground">#050505</item>
          <item name="android:statusBarColor">#050505</item>
          </style></resources>
          EOF

          # 5. activity_main.xml (Quantum Interface)
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#050505" android:padding="12dp">
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="JsAI QUANTUM CORE v1.5" android:textColor="#00E5FF" android:fontFamily="monospace" android:textSize="12sp"/>
              <ProgressBar android:id="@+id/progress" style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent" android:layout_height="wrap_content" android:progressTint="#00E5FF" android:layout_marginTop="4dp"/>
              <TextView android:id="@+id/stats" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="RAM OPTIMIZED | READY" android:textColor="#555555" android:textSize="10sp" android:gravity="right"/>
              <ScrollView android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:layout_marginTop="8dp">
                  <TextView android:id="@+id/console" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:textColor="#FFFFFF" android:fontFamily="monospace" android:textSize="14sp"/>
              </ScrollView>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <Button android:id="@+id/loadBtn" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="LOAD" android:textSize="10sp"/>
                  <Button android:id="@+id/trainBtn" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="TRAIN (75 EPOCHS)" android:layout_marginHorizontal="4dp" android:textSize="10sp"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#111111" android:padding="4dp">
                  <EditText android:id="@+id/input" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:hint="Enter prompt..." android:textColor="#FFFFFF" android:background="@null" android:padding="12dp"/>
                  <ImageButton android:id="@+id/sendBtn" android:layout_width="50dp" android:layout_height="50dp" android:src="@android:drawable/ic_menu_send" android:backgroundTint="#00E5FF"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 6. MainActivity.kt (Quantum Logic)
          cat > app/src/main/java/com/jsai/quantum/MainActivity.kt << 'EOF'
          package com.jsai.quantum
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import java.util.*
          import com.jsai.quantum.R

          class MainActivity : AppCompatActivity() {
              private lateinit var console: TextView
              private lateinit var bar: ProgressBar
              private lateinit var stats: TextView
              
              private var datasetText = ""
              private val vocab = mutableMapOf<String, Int>()
              private val revVocab = mutableMapOf<Int, String>()
              private val connections = mutableMapOf<Int, MutableMap<Int, Float>>()
              private var isTraining = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  console = findViewById(R.id.console)
                  bar = findViewById(R.id.progress)
                  stats = findViewById(R.id.stats)
                  val input = findViewById<EditText>(R.id.input)

                  console.text = ">>> SYSTEM: QUANTUM INITIALIZED\n>>> MEMORY: 4GB COMPATIBLE\n"

                  findViewById<Button>(R.id.loadBtn).setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply { type = "text/*"; putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true) }
                      startActivityForResult(intent, 101)
                  }

                  findViewById<Button>(R.id.trainBtn).setOnClickListener { if(!isTraining && datasetText.isNotEmpty()) runQuantumTraining() }

                  findViewById<ImageButton>(R.id.sendBtn).setOnClickListener {
                      val prompt = input.text.toString()
                      if (prompt.isNotEmpty()) {
                          console.append("\nUSER: $prompt")
                          input.setText("")
                          val response = generateQuantumResponse(prompt)
                          console.append("\nJSAI: $response")
                      }
                  }
              }

              private fun runQuantumTraining() {
                  isTraining = true
                  CoroutineScope(Dispatchers.Main).launch {
                      console.append("\n[QUANTUM TRAINING STARTING - 75 EPOCHS]")
                      val tokens = datasetText.lowercase().split(Regex("\\s+")).filter { it.isNotBlank() }
                      
                      // 1. Build Vocab
                      tokens.distinct().forEachIndexed { i, s -> vocab[s] = i; revVocab[i] = s }
                      
                      val epochs = 75
                      for (epoch in 1..epochs) {
                          delay(10)
                          withContext(Dispatchers.Default) {
                              for (i in 0 until tokens.size - 1) {
                                  val t1 = vocab[tokens[i]]!!; val t2 = vocab[tokens[i+1]]!!
                                  val map = connections.getOrPut(t1) { mutableMapOf() }
                                  map[t2] = (map[t2] ?: 0f) + 1.0f
                              }
                          }
                          bar.progress = (epoch * 100 / epochs)
                          stats.text = "EPOCH: $epoch/75 | NODES: ${vocab.size}"
                      }
                      console.append("\n[TRAINING COMPLETE: Latent space mapped]")
                      isTraining = false
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode == Activity.RESULT_OK && data != null) {
                      val sb = StringBuilder()
                      data.clipData?.let { for(i in 0 until it.itemCount) sb.append(readUri(it.getItemAt(i).uri)) }
                      ?: data.data?.let { sb.append(readUri(it)) }
                      datasetText = sb.toString()
                      console.append("\n[DATASET LOADED: ${datasetText.length} chars]")
                  }
              }

              private fun readUri(uri: android.net.Uri) = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""

              private fun generateQuantumResponse(prompt: String): String {
                  if (vocab.isEmpty()) return "Model not trained."
                  val words = prompt.lowercase().split(" ")
                  var currentId = vocab[words.last()] ?: vocab.values.random()
                  val res = mutableListOf<String>()
                  
                  repeat(40) {
                      val nexts = connections[currentId]
                      if (nexts != null) {
                          currentId = nexts.maxByOrNull { it.value }?.key ?: vocab.values.random()
                          res.add(revVocab[currentId] ?: "")
                      } else {
                          currentId = vocab.values.random()
                          res.add(revVocab[currentId] ?: "")
                      }
                  }
                  return res.joinToString(" ")
              }
          }
          EOF

          # 7. Android Manifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="JsAI Quantum" android:theme="@style/Theme.JsAI" android:largeHeap="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          </manifest>
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JsAI-Quantum-Build
          path: app/build/outputs/apk/debug/app-debug.apk
