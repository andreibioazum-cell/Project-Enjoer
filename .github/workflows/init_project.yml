name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install LLD Linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Generate Project
        run: |
          mkdir enjoer_game && cd enjoer_game
          keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=E,O=E,C=US"
          
          cat << 'EOF' > Cargo.toml
          [package]
          name = "enjoer_game"
          version = "7.0.0"
          edition = "2021"

          [lib]
          name = "enjoer_game"
          crate-type = ["cdylib"]

          [dependencies]
          bevy = { version = "0.14.0", default-features = false, features = [
              "bevy_pbr", "bevy_render", "bevy_winit", "bevy_core_pipeline",
              "bevy_asset", "bevy_state", "bevy_color", "bevy_scene",
              "multi_threaded", "x11", "default_font", "android_shared_stdcxx"
          ] }
          bevy_egui = "0.28.0"

          [package.metadata.android]
          apk_name = "EnjoerGame"
          build_targets = ["aarch64-linux-android"]
          min_sdk_version = 24
          target_sdk_version = 33
          strip = "strip"
          fullscreen = true

          [package.metadata.android.signing.release]
          path = "release.keystore"
          keystore_password = "password"
          key_alias = "mykey"
          key_password = "password"

          [profile.release]
          opt-level = 3
          lto = "thin" 
          codegen-units = 1
          EOF
          
          mkdir src
          cat << 'EOF' > src/lib.rs
          use bevy::prelude::*;
          use bevy::window::{PrimaryWindow, WindowMode};
          use bevy_egui::{egui, EguiContexts, EguiPlugin};

          #[derive(States, Debug, Clone, Copy, Eq, PartialEq, Hash, Default)]
          enum GameState { #[default] Menu, Play }

          #[derive(Component)] struct Player { walk: f32 }
          #[derive(Component)] struct Pivot;
          #[derive(Component)] struct Model;
          #[derive(Component)] enum Limb { Arm(f32), Leg(f32) }

          #[derive(Resource, Default)]
          struct Controls { move_dir: Vec2, look: Vec2, joy_c: Option<Vec2>, joy_cur: Option<Vec2> }

          #[bevy_main]
          fn main() {
              App::new()
                  .add_plugins(DefaultPlugins.set(WindowPlugin {
                      primary_window: Some(Window { title: "Enjoer".into(), mode: WindowMode::BorderlessFullscreen, ..default() }), ..default()
                  }))
                  .insert_resource(Msaa::Off)
                  .add_plugins(EguiPlugin)
                  .init_state::<GameState>()
                  .init_resource::<Controls>()
                  .add_systems(Startup, setup)
                  .add_systems(Update, style)
                  .add_systems(Update, menu.run_if(in_state(GameState::Menu)))
                  .add_systems(Update, (touch, hud, move_player, animate).run_if(in_state(GameState::Play)))
                  .run();
          }

          fn setup(mut cmd: Commands, mut mesh: ResMut<Assets<Mesh>>, mut mat: ResMut<Assets<StandardMaterial>>) {
              // Улучшенное освещение (без теней для скорости)
              cmd.insert_resource(AmbientLight { color: Color::WHITE, brightness: 100.0 });
              cmd.spawn(DirectionalLightBundle { 
                  directional_light: DirectionalLight { illuminance: 5000., shadows_enabled: false, ..default() }, 
                  transform: Transform::from_xyz(10., 20., 10.).looking_at(Vec3::ZERO, Vec3::Y), ..default() 
              });

              // Пол
              cmd.spawn(PbrBundle { 
                  mesh: mesh.add(Plane3d::default().mesh().size(1000., 1000.)), 
                  material: mat.add(StandardMaterial { base_color: Color::srgb(0.2, 0.2, 0.2), unlit: false, ..default() }), ..default() 
              });
              
              let body_mat = mat.add(StandardMaterial { base_color: Color::WHITE, ..default() });

              // Персонаж. Корень на y=2.8 (высота ног + половина торса)
              cmd.spawn((SpatialBundle::from_transform(Transform::from_xyz(0., 2.8, 0.)), Player { walk: 0. }))
              .with_children(|p| {
                  p.spawn((SpatialBundle::default(), Pivot)).with_children(|piv| {
                      piv.spawn(Camera3dBundle { transform: Transform::from_xyz(0., 4., 10.).looking_at(Vec3::Y * 1.5, Vec3::Y), ..default() });
                  });
                  p.spawn((SpatialBundle::default(), Model)).with_children(|m| {
                      // Торс: 1.6 ширина, 1.8 высота, 0.8 глубина
                      m.spawn(PbrBundle { mesh: mesh.add(Cuboid::new(1.6, 1.8, 0.8)), material: body_mat.clone(), ..default() });
                      
                      // Голова: 1.1x1.1x1.1 (чуть закруглена пропорциями)
                      m.spawn(PbrBundle { 
                          mesh: mesh.add(Cuboid::new(1.1, 1.1, 1.1)), 
                          material: body_mat.clone(), 
                          transform: Transform::from_xyz(0., 1.45, 0.) 
                      });
                      
                      let mut limb = |p: &mut ChildBuilder, a: bool, l: bool, pos: Vec3| {
                          // Руки/Ноги тоньше: 0.6x1.8x0.6
                          p.spawn((SpatialBundle::from_transform(Transform::from_translation(pos)), if a { Limb::Arm(if l{1.}else{-1.}) } else { Limb::Leg(if l{1.}else{-1.}) }))
                          .with_children(|c| { 
                              c.spawn(PbrBundle { 
                                  mesh: mesh.add(Cuboid::new(0.6, 1.8, 0.6)), 
                                  material: body_mat.clone(), 
                                  transform: Transform::from_xyz(0., -0.9, 0.) // Смещение вниз от точки вращения
                              }); 
                          });
                      };
                      // Плечи подняты к верху торса (y=0.8)
                      limb(m, true, true, Vec3::new(-1.1, 0.8, 0.));  
                      limb(m, true, false, Vec3::new(1.1, 0.8, 0.)); 
                      // Ноги (y=-0.9)
                      limb(m, false, true, Vec3::new(-0.4, -0.9, 0.));
                      limb(m, false, false, Vec3::new(0.4, -0.9, 0.));
                  });
              });
          }

          fn touch(touches: Res<Touches>, q_win: Query<&Window, With<PrimaryWindow>>, mut ctrl: ResMut<Controls>) {
              ctrl.move_dir = Vec2::ZERO; ctrl.look = Vec2::ZERO;
              let Ok(w) = q_win.get_single() else { return };
              for t in touches.iter() {
                  let p = t.position();
                  if p.x < w.width() / 2. {
                      if ctrl.joy_c.is_none() || touches.just_pressed(t.id()) { ctrl.joy_c = Some(p); }
                      ctrl.joy_cur = Some(p);
                      ctrl.move_dir = ((p - ctrl.joy_c.unwrap()) / 80.).clamp_length_max(1.0);
                      ctrl.move_dir.y = -ctrl.move_dir.y;
                  } else {
                      ctrl.look += t.delta();
                  }
              }
              if touches.iter().filter(|t| t.position().x < w.width()/2.).count() == 0 { 
                  ctrl.joy_c = None; ctrl.joy_cur = None; 
              }
          }

          fn move_player(time: Res<Time>, ctrl: Res<Controls>, mut q_pl: Query<(&mut Transform, &mut Player)>, mut q_piv: Query<&mut Transform, (With<Pivot>, Without<Player>)>, mut q_mod: Query<&mut Transform, (With<Model>, Without<Player>, Without<Pivot>)>) {
              let Ok(mut piv_trans) = q_piv.get_single_mut() else { return };
              let (y, p, _) = piv_trans.rotation.to_euler(EulerRot::YXZ);
              if ctrl.look != Vec2::ZERO {
                  piv_trans.rotation = Quat::from_euler(EulerRot::YXZ, y - ctrl.look.x * 0.005, (p - ctrl.look.y * 0.005).clamp(-0.8, 0.5), 0.);
              }
              let rot_y = Quat::from_rotation_y(y);
              let dt = time.delta_seconds();
              for (mut pt, mut pl) in q_pl.iter_mut() {
                  let mut dir = rot_y * Vec3::NEG_Z * ctrl.move_dir.y + rot_y * Vec3::X * ctrl.move_dir.x;
                  dir.y = 0.; 
                  if dir.length() > 0.1 { 
                      let d = dir.normalize();
                      pt.translation += d * 12.0 * dt;
                      for mut m in q_mod.iter_mut() { 
                          m.rotation = m.rotation.slerp(Quat::from_rotation_y(f32::atan2(d.x, d.z)), 15. * dt); 
                      }
                      pl.walk += dt * 12.0;
                  } else { pl.walk = 0.; }
              }
          }

          fn animate(q_pl: Query<&Player>, mut q_l: Query<(&Limb, &mut Transform)>) {
              if let Ok(pl) = q_pl.get_single() {
                  let w = pl.walk.sin();
                  for (l, mut t) in q_l.iter_mut() {
                      match l { 
                          Limb::Arm(s) => t.rotation = Quat::from_rotation_x(w * 0.8 * s), 
                          Limb::Leg(s) => t.rotation = Quat::from_rotation_x(-w * 0.8 * s) 
                      }
                  }
              }
          }

          fn style(mut ctx: EguiContexts) {
              let mut v = egui::Visuals::dark();
              v.window_fill = egui::Color32::from_rgb(10, 10, 10);
              ctx.ctx_mut().set_visuals(v);
          }

          fn menu(mut ctx: EguiContexts, mut next: ResMut<NextState<GameState>>) {
              egui::CentralPanel::default().show(ctx.ctx_mut(), |ui| {
                  ui.vertical_centered(|ui| {
                      ui.add_space(100.);
                      ui.heading(egui::RichText::new("ENJOER").size(80.).strong().color(egui::Color32::WHITE));
                      ui.add_space(60.);
                      if ui.add_sized([250., 80.], egui::Button::new("PLAY")).clicked() { next.set(GameState::Play); }
                  });
              });
          }

          fn hud(mut ctx: EguiContexts, mut next: ResMut<NextState<GameState>>, ctrl: Res<Controls>, q_win: Query<&Window, With<PrimaryWindow>>) {
              let Ok(win) = q_win.get_single() else { return };
              let h = win.height();
              egui::Area::new(egui::Id::new("h")).fixed_pos(egui::pos2(0., 0.)).show(ctx.ctx_mut(), |ui| {
                  if ui.put(egui::Rect::from_min_size(egui::pos2(20., 20.), egui::vec2(80., 40.)), egui::Button::new("Exit")).clicked() { 
                      next.set(GameState::Menu); 
                  }
                  let p = ui.painter();
                  if let (Some(c), Some(cur)) = (ctrl.joy_c, ctrl.joy_cur) {
                      p.circle_filled(egui::pos2(c.x, c.y), 60., egui::Color32::from_black_alpha(150));
                      p.circle_filled(egui::pos2(cur.x, cur.y), 25., egui::Color32::WHITE);
                  }
              });
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup NDK/SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "platforms;android-30" "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          work-dir: enjoer_game

      - name: Build APK
        run: |
          cargo install cargo-apk
          cd enjoer_game
          export ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/25.2.9519653
          export ANDROID_HOME=${ANDROID_HOME}
          export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
          cargo apk build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: Enjoer-Game-APK, path: enjoer_game/target/release/apk/*.apk }
