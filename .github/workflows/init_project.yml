name: MadGPT Ultra-Fast Mobile Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project Structure
        run: |
          # Создаем все папки заранее
          mkdir -p app/src/main/java/com/madgpt/ultra
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 1. settings.gradle
          echo "include ':app'" > settings.gradle

          # 2. Корневой build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20' 
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 3. app/build.gradle (Оптимизация под ARM процессоры)
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.madgpt.ultra'
              compileSdk 34
              defaultConfig {
                  applicationId "com.madgpt.ultra"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-Ultra"
                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 4. Ресурсы (Цвета и Тема - БЕЗ НИХ БУДЕТ ОШИБКА)
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="green_matrix">#00FF41</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.MadGPTUltra" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/green_matrix</item>
                  <item name="android:windowBackground">@color/black</item>
              </style>
          </resources>
          EOF

          # 5. Android Manifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:label="MadGPT Ultra" 
                  android:theme="@style/Theme.MadGPTUltra"
                  android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Layout
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#000000" android:padding="16dp">
              <TextView android:id="@+id/chatLog" android:layout_width="match_parent" android:layout_height="0dp"
                  android:layout_weight="1" android:textColor="#FFFFFF" android:fontFamily="monospace" android:text="MadGPT Ultra Ready...\n"/>
              <EditText android:id="@+id/userInput" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:hint="Запрос..." android:textColor="#FFFFFF" android:textColorHint="#555555"/>
              <Button android:id="@+id/btnSend" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="SEND" android:backgroundTint="#00FF41" android:textColor="#000000"/>
          </LinearLayout>
          EOF

          # 7. MainActivity.kt
          cat > app/src/main/java/com/madgpt/ultra/MainActivity.kt << 'EOF'
          package com.madgpt.ultra
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import ai.onnxruntime.*
          import kotlinx.coroutines.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val chatLog = findViewById<TextView>(R.id.chatLog)
                  val input = findViewById<EditText>(R.id.userInput)
                  findViewById<Button>(R.id.btnSend).setOnClickListener {
                      chatLog.append("\nЯ: ${input.text}")
                      chatLog.append("\nБот: Оптимизация активна. Жду модель...\n")
                      input.setText("")
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadGPT-Ultra-Final
          path: app/build/outputs/apk/debug/app-debug.apk
