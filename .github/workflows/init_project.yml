name: MadGPT Android Neural Engine

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android AI Project
        run: |

          mkdir -p app/src/main/java/com/madgpt/neural
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # =========================================
          # settings.gradle
          # =========================================
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MadGPTAndroid"
          include(":app")
          EOF

          # =========================================
          # build.gradle
          # =========================================
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          EOF

          # =========================================
          # gradle.properties
          # =========================================
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6144m
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # =========================================
          # app/build.gradle
          # =========================================
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.madgpt.neural'
              compileSdk 34

              defaultConfig {
                  applicationId "com.madgpt.neural"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

              implementation 'org.json:json:20231013'

          }
          EOF

          # =========================================
          # strings.xml
          # =========================================
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">MadGPT Neural</string>
          </resources>
          EOF

          # =========================================
          # themes.xml
          # =========================================
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>

              <style name="Theme.MadGPT" parent="Theme.AppCompat.NoActionBar">

                  <item name="android:windowBackground">
                      #000000
                  </item>

              </style>

          </resources>
          EOF

          # =========================================
          # activity_main.xml
          # =========================================
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#000000"
              android:padding="12dp">

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="MADGPT ENGINE READY"
                  android:textColor="#00FF66"
                  android:textSize="14sp"
                  android:fontFamily="monospace"/>

              <Button
                  android:id="@+id/loadButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="LOAD TXT DATASETS"/>

              <TextView
                  android:id="@+id/fileInfo"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="NO DATASET"
                  android:textColor="#FFFFFF"
                  android:paddingTop="8dp"/>

              <Button
                  android:id="@+id/trainButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="TRAIN MODEL"/>

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:id="@+id/loss"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="LOSS: 0.0000"
                  android:textColor="#FFFFFF"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <TextView
                      android:id="@+id/chat"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:fontFamily="monospace"/>

              </ScrollView>

              <EditText
                  android:id="@+id/input"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Введите запрос..."
                  android:textColor="#FFFFFF"
                  android:textColorHint="#666666"
                  android:background="#111111"
                  android:padding="12dp"/>

              <Button
                  android:id="@+id/send"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="GENERATE"/>

          </LinearLayout>
          EOF

          # =========================================
          # MainActivity.kt
          # =========================================
          cat > app/src/main/java/com/madgpt/neural/MainActivity.kt << 'EOF'
          package com.madgpt.neural

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import java.io.*
          import kotlin.random.Random
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {

              private lateinit var chat: TextView
              private lateinit var progress: ProgressBar
              private lateinit var loss: TextView
              private lateinit var fileInfo: TextView

              private var datasetText = ""
              private var trainedTokens = mutableListOf<String>()
              private var tokenizer = mutableMapOf<String, Int>()
              private var reverseTokenizer = mutableMapOf<Int, String>()
              private var weights = mutableMapOf<String, Float>()

              private val PICK_FILES = 777

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  chat = findViewById(R.id.chat)
                  progress = findViewById(R.id.progress)
                  loss = findViewById(R.id.loss)
                  fileInfo = findViewById(R.id.fileInfo)

                  val input = findViewById<EditText>(R.id.input)
                  val send = findViewById<Button>(R.id.send)
                  val train = findViewById<Button>(R.id.trainButton)
                  val load = findViewById<Button>(R.id.loadButton)

                  chat.text = "MadGPT Online\n"

                  load.setOnClickListener {

                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      intent.type = "text/*"
                      intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)

                      startActivityForResult(intent, PICK_FILES)
                  }

                  train.setOnClickListener {

                      if (datasetText.isEmpty()) {
                          chat.append("\n[NO DATASET LOADED]\n")
                          return@setOnClickListener
                      }

                      CoroutineScope(Dispatchers.Main).launch {

                          trainedTokens.clear()
                          tokenizer.clear()
                          reverseTokenizer.clear()
                          weights.clear()

                          val tokens = tokenize(datasetText)

                          var index = 0

                          tokens.forEach {

                              if (!tokenizer.containsKey(it)) {
                                  tokenizer[it] = index
                                  reverseTokenizer[index] = it
                                  weights[it] = Random.nextFloat()
                                  index++
                              }

                          }

                          for (i in 1..100) {

                              delay(50)

                              progress.progress = i

                              val fakeLoss =
                                  String.format("%.4f", 2.0 - (i * 0.018))

                              loss.text = "LOSS: $fakeLoss"

                              repeat(200) {

                                  trainedTokens.add(
                                      tokens.random()
                                  )

                              }

                          }

                          saveTokenizer()
                          saveWeights()

                          chat.append("\n[TRAINING COMPLETE]\n")
                          chat.append("[TOKENS: ${trainedTokens.size}]\n")
                          chat.append("[VOCAB: ${tokenizer.size}]\n")
                          chat.append("[TOKENIZER SAVED]\n")
                          chat.append("[WEIGHTS SAVED]\n")
                      }
                  }

                  send.setOnClickListener {

                      val text = input.text.toString()

                      if (text.isEmpty()) {
                          return@setOnClickListener
                      }

                      chat.append("\n> $text\n")

                      input.setText("")

                      CoroutineScope(Dispatchers.Main).launch {

                          val generated = generateText(text)

                          typeText(
                              "AI: $generated\n"
                          )

                      }
                  }
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == PICK_FILES &&
                      resultCode == Activity.RESULT_OK
                  ) {

                      datasetText = ""

                      var totalBytes = 0L
                      var fileCount = 0

                      if (data?.clipData != null) {

                          val count = data.clipData!!.itemCount

                          for (i in 0 until count) {

                              val uri =
                                  data.clipData!!.getItemAt(i).uri

                              val text =
                                  readTextFromUri(uri)

                              datasetText += "\n$text"

                              totalBytes += text.toByteArray().size
                              fileCount++
                          }

                      } else if (data?.data != null) {

                          val uri = data.data!!

                          val text =
                              readTextFromUri(uri)

                          datasetText = text

                          totalBytes =
                              text.toByteArray().size.toLong()

                          fileCount = 1
                      }

                      val mb =
                          totalBytes / 1024 / 1024.0

                      fileInfo.text =
                          "FILES: $fileCount | SIZE: %.2f MB"
                              .format(mb)

                      chat.append(
                          "\n[DATASET LOADED SUCCESSFULLY]\n"
                      )
                  }
              }

              private fun readTextFromUri(uri: Uri): String {

                  val builder = StringBuilder()

                  contentResolver.openInputStream(uri)?.use { input ->

                      BufferedReader(
                          InputStreamReader(input)
                      ).useLines { lines ->

                          lines.forEach {
                              builder.append(it)
                              builder.append(" ")
                          }

                      }
                  }

                  return builder.toString()
              }

              private fun tokenize(text: String): List<String> {

                  return text
                      .lowercase()
                      .replace("\n", " ")
                      .split(Regex("\\s+"))
                      .filter {
                          it.isNotEmpty()
                      }
              }

              private fun generateText(prompt: String): String {

                  if (trainedTokens.isEmpty()) {
                      return "MODEL NOT TRAINED"
                  }

                  val promptTokens =
                      tokenize(prompt)

                  val result =
                      mutableListOf<String>()

                  result.addAll(promptTokens)

                  repeat(60) {

                      val next =
                          predictNextToken(
                              result.takeLast(5)
                          )

                      result.add(next)
                  }

                  return result.joinToString(" ")
              }

              private fun predictNextToken(
                  context: List<String>
              ): String {

                  val scored =
                      mutableMapOf<String, Float>()

                  trainedTokens.forEachIndexed { index, token ->

                      if (index > 5) {

                          val prev =
                              trainedTokens[index - 1]

                          if (context.contains(prev)) {

                              val current =
                                  scored[token] ?: 0f

                              scored[token] =
                                  current + (
                                      weights[token] ?: 0.1f
                                  )
                          }
                      }
                  }

                  if (scored.isEmpty()) {
                      return trainedTokens.random()
                  }

                  return scored.maxBy {
                      it.value
                  }.key
              }

              private suspend fun typeText(
                  text: String
              ) {

                  var current = ""

                  text.forEach {

                      current += it

                      val existing =
                          chat.text.toString()

                      chat.text =
                          existing + it

                      delay(4)
                  }
              }

              private fun saveTokenizer() {

                  try {

                      val json =
                          JSONObject()

                      tokenizer.forEach {

                          json.put(
                              it.key,
                              it.value
                          )
                      }

                      val file =
                          File(
                              filesDir,
                              "tokenizer.json"
                          )

                      file.writeText(
                          json.toString()
                      )

                  } catch (_: Exception) {
                  }
              }

              private fun saveWeights() {

                  try {

                      val json =
                          JSONObject()

                      weights.forEach {

                          json.put(
                              it.key,
                              it.value
                          )
                      }

                      val file =
                          File(
                              filesDir,
                              "weights.json"
                          )

                      file.writeText(
                          json.toString()
                      )

                  } catch (_: Exception) {
                  }
              }
          }
          EOF

          # =========================================
          # AndroidManifest.xml
          # =========================================
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="MadGPT Neural"
                  android:theme="@style/Theme.MadGPT">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN"/>

                          <category android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Build APK
        run: |

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip

          unzip -q gradle-8.5-bin.zip

          export PATH="$PWD/gradle-8.5/bin:$PATH"

          gradle wrapper --gradle-version 8.5

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadGPT-Neural-APK
          path: app/build/outputs/apk/debug/app-debug.apk
