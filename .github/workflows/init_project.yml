name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install LLD Linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Generate Project
        run: |
          mkdir enjoer_game && cd enjoer_game
          keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=E,O=E,C=US"
          
          cat << 'EOF' > Cargo.toml
          [package]
          name = "enjoer_game"
          version = "7.0.0"
          edition = "2021"

          [lib]
          name = "enjoer_game"
          crate-type = ["cdylib"]

          [dependencies]
          bevy = { version = "0.14.0", default-features = false, features = [
              "bevy_pbr",
              "bevy_render",
              "bevy_winit",
              "bevy_core_pipeline",
              "bevy_asset",
              "multi_threaded",
              "x11",
              "default_font",
              "tonemapping_luts",
              "android_shared_stdcxx"
          ] }
          bevy_egui = "0.28.0"

          [package.metadata.android]
          apk_name = "EnjoerGame"
          build_targets = ["aarch64-linux-android"]
          min_sdk_version = 24
          target_sdk_version = 33
          strip = "strip"
          fullscreen = true

          [package.metadata.android.activity_attributes]
          "android:screenOrientation" = "sensorLandscape"
          "android:resizeableActivity" = "false"

          [package.metadata.android.signing.release]
          path = "release.keystore"
          keystore_password = "password"
          key_alias = "mykey"
          key_password = "password"

          [profile.release]
          opt-level = 3
          lto = "thin" 
          codegen-units = 1
          EOF
          
          mkdir src
          cat << 'EOF' > src/lib.rs
          use bevy::prelude::*;
          use bevy::window::{PrimaryWindow, WindowMode};
          use bevy_egui::{egui, EguiContexts, EguiPlugin};

          #[derive(States, Debug, Clone, Copy, Eq, PartialEq, Hash, Default)]
          enum GameState { #[default] Menu, Play }

          #[derive(Component)] struct Player { vel: f32, ground: bool, walk: f32 }
          #[derive(Component)] struct Pivot;
          #[derive(Component)] struct Model;
          #[derive(Component)] enum Limb { Arm(f32), Leg(f32) }

          #[derive(Resource, Default)]
          struct Controls { move_dir: Vec2, look: Vec2, jump: bool, joy_c: Option<Vec2>, joy_cur: Option<Vec2> }

          #[bevy_main]
          fn main() {
              App::new()
                  .add_plugins(DefaultPlugins.set(WindowPlugin {
                      primary_window: Some(Window { title: "Enjoer".into(), mode: WindowMode::BorderlessFullscreen, ..default() }), ..default()
                  }))
                  .insert_resource(Msaa::Off)
                  .add_plugins(EguiPlugin)
                  .init_state::<GameState>()
                  .init_resource::<Controls>()
                  .add_systems(Startup, setup)
                  .add_systems(Update, style)
                  .add_systems(Update, menu.run_if(in_state(GameState::Menu)))
                  .add_systems(Update, (touch, hud, move_player, animate).run_if(in_state(GameState::Play)))
                  .run();
          }

          fn setup(mut cmd: Commands, mut mesh: ResMut<Assets<Mesh>>, mut mat: ResMut<Assets<StandardMaterial>>) {
              cmd.insert_resource(AmbientLight { color: Color::srgb(0.16, 0.20, 0.26), brightness: 400.0 });
              cmd.spawn(DirectionalLightBundle { directional_light: DirectionalLight { illuminance: 8000., shadows_enabled: true, ..default() }, transform: Transform::from_xyz(5., 10., 3.).looking_at(Vec3::ZERO, Vec3::Y), ..default() });
              cmd.spawn(PbrBundle { mesh: mesh.add(Plane3d::default().mesh().size(200., 200.)), material: mat.add(Color::srgb(0.07, 0.12, 0.2)), ..default() });
              
              let (skin, torso, legs) = (mat.add(Color::srgb(1., 0.82, 0.6)), mat.add(Color::srgb(0.1, 0.4, 1.)), mat.add(Color::srgb(0.1, 0.8, 0.2)));

              cmd.spawn((SpatialBundle::from_transform(Transform::from_xyz(0., 3.4, 0.)), Player { vel: 0., ground: false, walk: 0. }))
              .with_children(|p| {
                  p.spawn((SpatialBundle::default(), Pivot)).with_children(|piv| {
                      piv.spawn((
                          Camera3dBundle { transform: Transform::from_xyz(0., 3., 12.).looking_at(Vec3::Y * 2., Vec3::Y), ..default() },
                      ));
                  });
                  p.spawn((SpatialBundle::default(), Model)).with_children(|m| {
                      m.spawn(PbrBundle { mesh: mesh.add(Cuboid::new(1.4, 1.8, 0.8)), material: torso, ..default() });
                      m.spawn(PbrBundle { mesh: mesh.add(Cuboid::new(1.15, 1.15, 1.15)), material: skin.clone(), transform: Transform::from_xyz(0., 1.475, 0.), ..default() });
                      let mut limb = |p: &mut ChildBuilder, m: Handle<StandardMaterial>, a: bool, l: bool, s: Vec3, pos: Vec3| {
                          p.spawn((SpatialBundle::from_transform(Transform::from_translation(pos)), if a { Limb::Arm(if l{1.}else{-1.}) } else { Limb::Leg(if l{1.}else{-1.}) }))
                          .with_children(|c| { c.spawn(PbrBundle { mesh: mesh.add(Cuboid::new(s.x, s.y, s.z)), material: m, transform: Transform::from_xyz(0., -s.y/2., 0.), ..default() }); });
                      };
                      limb(m, skin.clone(), true, true, Vec3::new(0.55, 1.6, 0.55), Vec3::new(-0.975, 0.8, 0.));
                      limb(m, skin, true, false, Vec3::new(0.55, 1.6, 0.55), Vec3::new(0.975, 0.8, 0.));
                      limb(m, legs.clone(), false, true, Vec3::new(0.7, 1.6, 0.7), Vec3::new(-0.35, -0.9, 0.));
                      limb(m, legs, false, false, Vec3::new(0.7, 1.6, 0.7), Vec3::new(0.35, -0.9, 0.));
                  });
              });
          }

          fn touch(touches: Res<Touches>, q_win: Query<&Window, With<PrimaryWindow>>, mut ctrl: ResMut<Controls>) {
              ctrl.move_dir = Vec2::ZERO; ctrl.look = Vec2::ZERO; ctrl.jump = false;
              let Ok(w) = q_win.get_single() else { return };
              let mut joy = false;
              for t in touches.iter() {
                  let p = t.position();
                  if p.x < w.width() / 2. {
                      joy = true;
                      if ctrl.joy_c.is_none() || touches.just_pressed(t.id()) { ctrl.joy_c = Some(p); }
                      ctrl.joy_cur = Some(p);
                      ctrl.move_dir = ((p - ctrl.joy_c.unwrap()) / 80.).clamp_length_max(1.);
                      ctrl.move_dir.y = -ctrl.move_dir.y;
                  } else {
                      if p.distance(Vec2::new(w.width() - 120., w.height() - 120.)) < 80. { ctrl.jump = true; } 
                      else { ctrl.look += t.delta(); }
                  }
              }
              if !joy { ctrl.joy_c = None; ctrl.joy_cur = None; }
          }

          fn move_player(time: Res<Time>, ctrl: Res<Controls>, mut q_pl: Query<(&mut Transform, &mut Player)>, mut q_piv: Query<&mut Transform, (With<Pivot>, Without<Player>)>, mut q_mod: Query<&mut Transform, (With<Model>, Without<Player>, Without<Pivot>)>) {
              let Ok(mut piv_trans) = q_piv.get_single_mut() else { return };
              let (y, p, _) = piv_trans.rotation.to_euler(EulerRot::YXZ);
              
              if ctrl.look != Vec2::ZERO {
                  piv_trans.rotation = Quat::from_euler(EulerRot::YXZ, y - ctrl.look.x * 0.005, (p - ctrl.look.y * 0.005).clamp(-0.8, 0.5), 0.);
              }

              let rot_y = Quat::from_rotation_y(y);
              
              for (mut pt, mut pl) in q_pl.iter_mut() {
                  let mut dir = rot_y * Vec3::NEG_Z * ctrl.move_dir.y + rot_y * Vec3::X * ctrl.move_dir.x;
                  dir.y = 0.; let mag = dir.length();
                  if mag > 0.1 { dir = dir.normalize(); }

                  if pt.translation.y <= 3.4 { pt.translation.y = 3.4; pl.ground = true; pl.vel = 0.; } 
                  else { pl.ground = false; pl.vel -= 25. * time.delta_seconds(); }
                  
                  if ctrl.jump && pl.ground { pl.vel = 12.0; }
                  pt.translation += dir * 12. * time.delta_seconds();
                  pt.translation.y += pl.vel * time.delta_seconds();

                  if mag > 0.1 {
                      for mut m in q_mod.iter_mut() { m.rotation = m.rotation.slerp(Quat::from_rotation_y(f32::atan2(dir.x, dir.z)), 15. * time.delta_seconds()); }
                      if pl.ground { pl.walk += time.delta_seconds() * 10. * mag; }
                  } else { pl.walk = 0.; }
              }
          }

          fn animate(q_pl: Query<&Player>, mut q_l: Query<(&Limb, &mut Transform)>) {
              if let Ok(pl) = q_pl.get_single() {
                  let jsp = if !pl.ground { 2.5 } else { 0. };
                  let w = pl.walk.sin();
                  for (l, mut t) in q_l.iter_mut() {
                      match l { Limb::Arm(s) => t.rotation = Quat::from_rotation_x(w * 0.6 * s - jsp), Limb::Leg(s) => t.rotation = Quat::from_rotation_x(-w * 0.5 * s) }
                  }
              }
          }

          fn style(mut ctx: EguiContexts) {
              let mut v = egui::Visuals::dark();
              v.window_fill = egui::Color32::from_rgb(2, 5, 10);
              v.panel_fill = egui::Color32::from_rgb(2, 5, 10);
              ctx.ctx_mut().set_visuals(v);
          }

          fn menu(mut ctx: EguiContexts, mut next: ResMut<NextState<GameState>>) {
              egui::CentralPanel::default().show(ctx.ctx_mut(), |ui| {
                  ui.vertical_centered(|ui| {
                      ui.add_space(80.);
                      ui.heading(egui::RichText::new("ENJOER").size(70.).color(egui::Color32::from_rgb(0, 191, 255)).strong());
                      ui.add_space(50.);
                      if ui.add_sized([300., 80.], egui::Button::new(egui::RichText::new("PLAY").size(30.).color(egui::Color32::WHITE))).clicked() { next.set(GameState::Play); }
                  });
              });
          }

          fn hud(mut ctx: EguiContexts, mut next: ResMut<NextState<GameState>>, ctrl: Res<Controls>, q_win: Query<&Window, With<PrimaryWindow>>) {
              let Ok(win) = q_win.get_single() else { return };
              let (w, h) = (win.width(), win.height());
              egui::Area::new(egui::Id::new("h")).fixed_pos(egui::pos2(0., 0.)).show(ctx.ctx_mut(), |ui| {
                  let p = ui.painter();
                  if ui.put(egui::Rect::from_min_size(egui::pos2(20., 20.), egui::vec2(80., 40.)), egui::Button::new(egui::RichText::new("Exit").color(egui::Color32::RED))).clicked() { next.set(GameState::Menu); }
                  if let (Some(c), Some(cur)) = (ctrl.joy_c, ctrl.joy_cur) {
                      p.circle_filled(egui::pos2(c.x, c.y), 60., egui::Color32::from_black_alpha(100));
                      p.circle_filled(egui::pos2(cur.x, cur.y), 25., egui::Color32::from_white_alpha(200));
                  } else { p.circle_filled(egui::pos2(120., h - 120.), 60., egui::Color32::from_black_alpha(50)); }
                  let jc = egui::pos2(w - 120., h - 120.);
                  p.circle_filled(jc, 60., if ctrl.jump { egui::Color32::from_white_alpha(200) } else { egui::Color32::from_black_alpha(100) });
                  p.text(jc, egui::Align2::CENTER_CENTER, "JUMP", egui::FontId::proportional(20.), egui::Color32::WHITE);
              });
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v3
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup NDK/SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          # ДОБАВЛЕНО "platforms;android-30", так как cargo-apk требует её
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "platforms;android-30" "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          work-dir: enjoer_game

      - name: Build APK
        run: |
          cargo install cargo-apk
          cd enjoer_game
          export ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/25.2.9519653
          export ANDROID_HOME=${ANDROID_HOME}
          export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
          cargo apk build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: Enjoer-Game-APK, path: enjoer_game/target/release/apk/*.apk }
