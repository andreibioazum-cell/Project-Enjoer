name: JsAI_Craft_3D_Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create 3D Project
        run: |
          mkdir -p app/src/main/java/com/jsai/craft
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # Ресурсы
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">JsAI Craft 3D</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
          <item name="android:windowFullscreen">true</item>
          </style></resources>
          EOF

          # Главная Активность
          cat > app/src/main/java/com/jsai/craft/MainActivity.java << 'EOF'
          package com.jsai.craft;
          import android.app.Activity;
          import android.opengl.GLSurfaceView;
          import android.os.Bundle;
          import android.view.MotionEvent;
          import android.view.Window;
          import android.view.WindowManager;

          public class MainActivity extends Activity {
              private GameGLView glView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  
                  glView = new GameGLView(this);
                  setContentView(glView);
              }
          }
          EOF

          # GL Surface View (Обработка касаний)
          cat > app/src/main/java/com/jsai/craft/GameGLView.java << 'EOF'
          package com.jsai.craft;
          import android.content.Context;
          import android.opengl.GLSurfaceView;
          import android.view.MotionEvent;

          public class GameGLView extends GLSurfaceView {
              private final GameRenderer renderer;
              private float previousX, previousY;

              public GameGLView(Context context) {
                  super(context);
                  setEGLContextClientVersion(2);
                  renderer = new GameRenderer();
                  setRenderer(renderer);
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  float x = e.getX();
                  float y = e.getY();
                  if (e.getAction() == MotionEvent.ACTION_MOVE) {
                      float dx = x - previousX;
                      float dy = y - previousY;
                      renderer.angleX += dx * 0.2f;
                      renderer.angleY += dy * 0.2f;
                  }
                  previousX = x;
                  previousY = y;
                  return true;
              }
          }
          EOF

          # Рендерер (OpenGL Логика 3D куба)
          cat > app/src/main/java/com/jsai/craft/GameRenderer.java << 'EOF'
          package com.jsai.craft;
          import android.opengl.GLES20;
          import android.opengl.GLSurfaceView;
          import android.opengl.Matrix;
          import java.nio.*;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;

          public class GameRenderer implements GLSurfaceView.Renderer {
              public float angleX, angleY;
              private final float[] vPMatrix = new float[16];
              private final float[] projectionMatrix = new float[16];
              private final float[] viewMatrix = new float[16];
              private final float[] rotationMatrix = new float[16];
              private Cube cube;

              @Override
              public void onSurfaceCreated(GL10 gl, EGLConfig config) {
                  GLES20.glClearColor(0.5f, 0.8f, 1.0f, 1.0f); // Цвет неба
                  GLES20.glEnable(GLES20.GL_DEPTH_TEST);
                  cube = new Cube();
              }

              @Override
              public void onDrawFrame(GL10 gl) {
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT | GLES20.GL_DEPTH_BUFFER_BIT);
                  Matrix.setLookAtM(viewMatrix, 0, 0, 0, -5, 0f, 0f, 0f, 0f, 1.0f, 0.0f);
                  Matrix.multiplyMM(vPMatrix, 0, projectionMatrix, 0, viewMatrix, 0);

                  float[] scratch = new float[16];
                  Matrix.setRotateM(rotationMatrix, 0, angleX, 0, 1, 0);
                  Matrix.rotateM(rotationMatrix, 0, angleY, 1, 0, 0);
                  Matrix.multiplyMM(scratch, 0, vPMatrix, 0, rotationMatrix, 0);

                  // Рисуем несколько блоков (как пол в майнкрафте)
                  for(int x = -2; x <= 2; x++) {
                      for(int z = -2; z <= 2; z++) {
                          float[] posMatrix = new float[16];
                          Matrix.translateM(posMatrix, 0, scratch, 0, x * 1.2f, -1.5f, z * 1.2f);
                          cube.draw(posMatrix);
                      }
                  }
              }

              @Override
              public void onSurfaceChanged(GL10 gl, int width, int height) {
                  GLES20.glViewport(0, 0, width, height);
                  float ratio = (float) width / height;
                  Matrix.frustumM(projectionMatrix, 0, -ratio, ratio, -1, 1, 3, 7);
              }

              public static int loadShader(int type, String shaderCode) {
                  int shader = GLES20.glCreateShader(type);
                  GLES20.glShaderSource(shader, shaderCode);
                  GLES20.glCompileShader(shader);
                  return shader;
              }
          }
          EOF

          # Класс Куба (Геометрия)
          cat > app/src/main/java/com/jsai/craft/Cube.java << 'EOF'
          package com.jsai.craft;
          import android.opengl.GLES20;
          import java.nio.*;

          public class Cube {
              private FloatBuffer vertexBuffer;
              private ShortBuffer drawListBuffer;
              private int mProgram;

              private final String vertexShaderCode = 
                  "uniform mat4 uMVPMatrix; attribute vec4 vPosition;" +
                  "void main() { gl_Position = uMVPMatrix * vPosition; }";
              private final String fragmentShaderCode = 
                  "precision mediump float; void main() { gl_FragColor = vec4(0.3, 0.6, 0.2, 1.0); }"; // Цвет травы

              static float coords[] = {
                  -0.5f, 0.5f, 0.5f, -0.5f, -0.5f, 0.5f, 0.5f, -0.5f, 0.5f, 0.5f, 0.5f, 0.5f,
                  -0.5f, 0.5f, -0.5f, -0.5f, -0.5f, -0.5f, 0.5f, -0.5f, -0.5f, 0.5f, 0.5f, -0.5f
              };
              private short drawOrder[] = { 0,1,2, 0,2,3, 4,5,6, 4,6,7, 0,4,7, 0,7,3, 1,5,6, 1,6,2, 0,4,5, 0,5,1, 3,7,6, 3,6,2 };

              public Cube() {
                  ByteBuffer bb = ByteBuffer.allocateDirect(coords.length * 4);
                  bb.order(ByteOrder.nativeOrder());
                  vertexBuffer = bb.asFloatBuffer();
                  vertexBuffer.put(coords);
                  vertexBuffer.position(0);

                  ByteBuffer dlb = ByteBuffer.allocateDirect(drawOrder.length * 2);
                  dlb.order(ByteOrder.nativeOrder());
                  drawListBuffer = dlb.asShortBuffer();
                  drawListBuffer.put(drawOrder);
                  drawListBuffer.position(0);

                  int vertexShader = GameRenderer.loadShader(GLES20.GL_VERTEX_SHADER, vertexShaderCode);
                  int fragmentShader = GameRenderer.loadShader(GLES20.GL_FRAGMENT_SHADER, fragmentShaderCode);
                  mProgram = GLES20.glCreateProgram();
                  GLES20.glAttachShader(mProgram, vertexShader);
                  GLES20.glAttachShader(mProgram, fragmentShader);
                  GLES20.glLinkProgram(mProgram);
              }

              public void draw(float[] mvpMatrix) {
                  GLES20.glUseProgram(mProgram);
                  int posHandle = GLES20.glGetAttribLocation(mProgram, "vPosition");
                  GLES20.glEnableVertexAttribArray(posHandle);
                  GLES20.glVertexAttribPointer(posHandle, 3, GLES20.GL_FLOAT, false, 12, vertexBuffer);
                  int matrixHandle = GLES20.glGetUniformLocation(mProgram, "uMVPMatrix");
                  GLES20.glUniformMatrix4fv(matrixHandle, 1, false, mvpMatrix, 0);
                  GLES20.glDrawElements(GLES20.GL_TRIANGLES, drawOrder.length, GLES20.GL_UNSIGNED_SHORT, drawListBuffer);
                  GLES20.glDisableVertexAttribArray(posHandle);
              }
          }
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application android:label="JsAI Craft 3D" android:theme="@style/AppTheme">
                  <activity android:name="com.jsai.craft.MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Настройки Gradle
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.jsai.craft'
              compileSdk 34
              defaultConfig { applicationId 'com.jsai.craft'; minSdk 24; targetSdk 34 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

      - name: Build APK (Твой метод)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JsAI_Craft_3D
          path: app/build/outputs/apk/debug/app-debug.apk
