name: AetheriaOS - Interactive Reliable Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aetheria-os:
    name: Build AetheriaOS (Interactive)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Android SDK & Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          override: true
          components: rust-src
          
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      # ===== 1. СОЗДАЁМ ЯДРО AETHERIAOS (Rust) =====
      - name: Create & Build Rust Kernel
        run: |
          mkdir -p aetheria_kernel/src
          
          # НАДЕЖНОСТЬ 100%: Шрифт вшит прямо в код, никаких загрузок из сети!
          cat > aetheria_kernel/src/font.rs << 'EOF'
