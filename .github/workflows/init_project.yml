name: JsAI-Unlimited-MultiBuild

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600 # Увеличено до 10 часов

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Maximize System Resources
        run: |
          # Убираем лимиты оперативной памяти для сборщика
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

      - name: Create JsAI Structure
        run: |
          # Новая структура под именем JsAI
          mkdir -p app/src/main/java/com/jsai/ultra
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/models # Папка для множества файлов моделей

          # 1. Настройки проекта
          echo "include ':app'" > settings.gradle

          # 2. Корневой build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20' 
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 3. app/build.gradle (Полная свобода ресурсов)
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.jsai.ultra'
              compileSdk 34
              defaultConfig {
                  applicationId "com.jsai.ultra"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "JsAI-Turbo"
                  multiDexEnabled true
              }
              
              # СНЯТИЕ ЛИМИТОВ НА ФАЙЛЫ:
              # Разрешаем загрузку любых файлов без сжатия (для скорости чтения ИИ)
              aaptOptions {
                  noCompress "" # Пустая строка значит "не сжимать НИЧЕГО" (максимальный размер и скорость)
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              
              packagingOptions {
                  resources {
                      excludes += '/META-INF/{AL2.0,LGPL2.1}'
                  }
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          # 4. Android Manifest (JsAI Config)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:label="JsAI" 
                  android:theme="@style/Theme.JsAI"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:extractNativeLibs="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          </manifest>
          EOF

          # 5. MainActivity.kt
          cat > app/src/main/java/com/jsai/ultra/MainActivity.kt << 'EOF'
          package com.jsai.ultra
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val log = findViewById<TextView>(R.id.chatLog)
                  val input = findViewById<EditText>(R.id.userInput)
                  
                  findViewById<Button>(R.id.btnSend).setOnClickListener {
                      log.append("\n[JsAI]: Файлы загружены. Лимиты сняты.")
                      log.append("\nUser: ${input.text}")
                      input.setText("")
                  }
              }
          }
          EOF

          # Ресурсы
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources>
          <color name="bg">#050505</color><color name="js_gold">#F7DF1E</color>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.JsAI" parent="Theme.AppCompat.DayNight.NoActionBar">
          <item name="colorPrimary">@color/js_gold</item><item name="android:windowBackground">@color/bg</item>
          </style></resources>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
          android:layout_width="match_parent" android:layout_height="match_parent"
          android:orientation="vertical" android:background="#050505" android:padding="16dp">
          <TextView android:id="@+id/chatLog" android:layout_width="match_parent" android:layout_height="0dp"
          android:layout_weight="1" android:textColor="#F7DF1E" android:fontFamily="monospace" android:text="JsAI SYSTEM ONLINE...\n"/>
          <EditText android:id="@+id/userInput" android:layout_width="match_parent" android:layout_height="wrap_content"
          android:hint="Type command..." android:textColor="#FFFFFF" android:textColorHint="#666666"/>
          <Button android:id="@+id/btnSend" android:layout_width="match_parent" android:layout_height="wrap_content"
          android:text="EXECUTE" android:backgroundTint="#F7DF1E" android:textColor="#000000"/>
          </LinearLayout>
          EOF

      - name: Build All Variants
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload All Artifacts (No Limits)
        uses: actions/upload-artifact@v4
        with:
          name: JsAI-Full-Package
          path: |
            app/build/outputs/apk/debug/
            app/build/outputs/logs/
          retention-days: 90
          compression-level: 0 # Без сжатия для сохранения структуры тяжелых файлов
