name: AetheriaOS - Final Fix
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aetheria-os:
    name: Build AetheriaOS (Fixed Font Size)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          override: true
          components: rust-src
          
      - name: Create & Build Rust Kernel
        run: |
          mkdir -p aetheria_kernel/src
          
          # 1. ИСПРАВЛЕННЫЙ ШРИФТ (РАЗМЕР 96)
