name: MadGPT Android Neural

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # CREATE PROJECT
      # ==========================================
      - name: Generate Android Project
        run: |

          mkdir -p app/src/main/java/com/madgpt/neural
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # ==========================================
          # settings.gradle
          # ==========================================
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MadGPTAndroid"
          include(":app")
          EOF

          # ==========================================
          # build.gradle
          # ==========================================
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          EOF

          # ==========================================
          # gradle.properties
          # ==========================================
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # ==========================================
          # APP BUILD.GRADLE
          # ==========================================
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.madgpt.neural'
              compileSdk 34

              defaultConfig {
                  applicationId "com.madgpt.neural"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
          }
          EOF

          # ==========================================
          # STRINGS
          # ==========================================
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">MadGPT Neural</string>
          </resources>
          EOF

          # ==========================================
          # THEMES
          # ==========================================
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.MadGPT" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          # ==========================================
          # LAYOUT
          # ==========================================
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="10dp"
              android:background="#000000">

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="MADGPT ENGINE READY"
                  android:textColor="#00FF66"
                  android:textSize="14sp"
                  android:fontFamily="monospace"/>

              <Button
                  android:id="@+id/loadDataset"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="LOAD TXT DATASET"/>

              <TextView
                  android:id="@+id/fileInfo"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="NO DATASET"
                  android:textColor="#FFFFFF"
                  android:paddingTop="8dp"
                  android:textSize="12sp"/>

              <Button
                  android:id="@+id/trainButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="TRAIN MODEL"/>

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:id="@+id/loss"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="LOSS: 0.0000"
                  android:textColor="#FFFFFF"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <TextView
                      android:id="@+id/chat"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:fontFamily="monospace"/>
              </ScrollView>

              <EditText
                  android:id="@+id/input"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Введите запрос..."
                  android:textColor="#FFFFFF"
                  android:textColorHint="#666666"
                  android:background="#111111"
                  android:padding="12dp"/>

              <Button
                  android:id="@+id/send"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="GENERATE"/>
          </LinearLayout>
          EOF

          # ==========================================
          # MAIN ACTIVITY
          # ==========================================
          cat > app/src/main/java/com/madgpt/neural/MainActivity.kt << 'EOF'
          package com.madgpt.neural

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import kotlin.random.Random

          class MainActivity : AppCompatActivity() {

              private var datasetText = ""
              private var trainedWords = mutableListOf<String>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val chat = findViewById<TextView>(R.id.chat)
                  val input = findViewById<EditText>(R.id.input)
                  val send = findViewById<Button>(R.id.send)
                  val train = findViewById<Button>(R.id.trainButton)
                  val progress = findViewById<ProgressBar>(R.id.progress)
                  val loss = findViewById<TextView>(R.id.loss)
                  val fileInfo = findViewById<TextView>(R.id.fileInfo)
                  val loadDataset = findViewById<Button>(R.id.loadDataset)

                  chat.text = "MadGPT Online\n"

                  val filePicker = registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { result ->

                      if (result.resultCode == Activity.RESULT_OK) {

                          val uri: Uri? = result.data?.data

                          if (uri != null) {

                              val builder = StringBuilder()

                              contentResolver.openInputStream(uri)?.use { stream ->
                                  BufferedReader(InputStreamReader(stream)).use { reader ->
                                      var line: String?

                                      while (true) {
                                          line = reader.readLine()

                                          if (line == null) {
                                              break
                                          }

                                          builder.append(line)
                                          builder.append(" ")
                                      }
                                  }
                              }

                              datasetText = builder.toString()

                              fileInfo.text =
                                  "DATASET LOADED: " +
                                  (datasetText.length / 1024).toString() +
                                  " KB"
                          }
                      }
                  }

                  loadDataset.setOnClickListener {

                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)

                      intent.addCategory(Intent.CATEGORY_OPENABLE)
                      intent.type = "text/plain"

                      filePicker.launch(intent)
                  }

                  train.setOnClickListener {

                      if (datasetText.isEmpty()) {
                          chat.append("\n[LOAD TXT FILE FIRST]\n")
                          return@setOnClickListener
                      }

                      CoroutineScope(Dispatchers.Main).launch {

                          trainedWords.clear()

                          val cleaned =
                              datasetText
                                  .replace("\n", " ")
                                  .replace("\r", " ")

                          val words =
                              cleaned
                                  .split(" ")
                                  .filter { it.length > 2 }

                          if (words.isEmpty()) {
                              chat.append("\n[EMPTY DATASET]\n")
                              return@launch
                          }

                          for (i in 1..100) {

                              delay(35)

                              progress.progress = i

                              val fakeLoss =
                                  String.format("%.4f", 2.5 - (i * 0.022))

                              loss.text = "LOSS: $fakeLoss"

                              repeat(200) {
                                  trainedWords.add(
                                      words.random()
                                  )
                              }
                          }

                          chat.append(
                              "\n[TRAINING COMPLETE]\n"
                          )

                          chat.append(
                              "[TOKENS: ${trainedWords.size}]\n"
                          )
                      }
                  }

                  send.setOnClickListener {

                      val text =
                          input.text.toString()

                      if (text.isEmpty()) {
                          return@setOnClickListener
                      }

                      chat.append("\n> $text\n")

                      input.setText("")

                      CoroutineScope(Dispatchers.Main).launch {

                          if (trainedWords.isEmpty()) {

                              chat.append(
                                  "AI: MODEL NOT TRAINED\n"
                              )

                              return@launch
                          }

                          val output =
                              StringBuilder()

                          val responseLength =
                              Random.nextInt(25, 60)

                          repeat(responseLength) {

                              delay(20)

                              output.append(
                                  trainedWords.random()
                              )

                              output.append(" ")

                              chat.text =
                                  chat.text.toString() +
                                  "AI: " +
                                  output.toString() +
                                  "\n"
                          }
                      }
                  }
              }
          }
          EOF

          # ==========================================
          # MANIFEST
          # ==========================================
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="MadGPT Neural"
                  android:theme="@style/Theme.MadGPT">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build APK
        run: |

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip

          unzip -q gradle-8.5-bin.zip

          export PATH="$PWD/gradle-8.5/bin:$PATH"

          gradle wrapper --gradle-version 8.5

          chmod +x gradlew

          ./gradlew assembleDebug

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadGPT-Neural-APK
          path: app/build/outputs/apk/debug/app-debug.apk
