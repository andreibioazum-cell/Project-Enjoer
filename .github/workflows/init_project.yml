name: JsAI Android Neural Engine

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Maximize System Resources
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=2g" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

      - name: Generate Android AI Project
        run: |
          mkdir -p app/src/main/java/com/jsai/neural
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 1. settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "JsAIAndroid"
          include(":app")
          EOF

          # 2. build.gradle (Root)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          EOF

          # 3. app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.jsai.neural'
              compileSdk 34
              defaultConfig {
                  applicationId "com.jsai.neural"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-Turbo"
                  multiDexEnabled true
                  ndk { abiFilters 'arm64-v8a' }
              }
              aaptOptions {
                  noCompress "" // БЕЗ ЛИМИТОВ НА РАЗМЕР ФАЙЛОВ
              }
              buildTypes {
                  release { minifyEnabled false; shrinkResources false }
                  debug { minifyEnabled false }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'org.json:json:20231013'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          # 4. Strings & Themes
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">JsAI Neural</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.JsAI" parent="Theme.AppCompat.NoActionBar">
          <item name="android:windowBackground">#000000</item></style></resources>
          EOF

          # 5. activity_main.xml (Важно: проверяем все ID)
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#000000" android:padding="12dp">
              <TextView android:id="@+id/status" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="JsAI ENGINE READY" android:textColor="#00FF66" android:fontFamily="monospace"/>
              <Button android:id="@+id/loadButton" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="LOAD DATASETS"/>
              <TextView android:id="@+id/fileInfo" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="NO DATASET" android:textColor="#FFFFFF"/>
              <Button android:id="@+id/trainButton" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="TRAIN MODEL"/>
              <ProgressBar android:id="@+id/progress" style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <TextView android:id="@+id/loss" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="LOSS: 0.0000" android:textColor="#FFFFFF"/>
              <ScrollView android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <TextView android:id="@+id/chat" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:textColor="#FFFFFF" android:fontFamily="monospace"/>
              </ScrollView>
              <EditText android:id="@+id/input" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:hint="Enter prompt..." android:textColor="#FFFFFF" android:background="#111111" android:padding="12dp"/>
              <Button android:id="@+id/send" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="GENERATE"/>
          </LinearLayout>
          EOF

          # 6. Android Manifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="JsAI Neural" android:theme="@style/Theme.JsAI" android:largeHeap="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          </manifest>
          EOF

          # 7. MainActivity.kt (С ЯВНЫМ ИМПОРТОМ R)
          cat > app/src/main/java/com/jsai/neural/MainActivity.kt << 'EOF'
          package com.jsai.neural

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import java.io.*
          import kotlin.random.Random
          import org.json.JSONObject
          import com.jsai.neural.R // ЯВНЫЙ ИМПОРТ РЕСУРСОВ

          class MainActivity : AppCompatActivity() {
              private lateinit var chat: TextView
              private lateinit var progress: ProgressBar
              private lateinit var loss: TextView
              private lateinit var fileInfo: TextView
              private var datasetText = ""
              private var transitionMatrix = mutableMapOf<String, MutableMap<String, Int>>()
              private var isTraining = false
              private val PICK_FILES = 777

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  chat = findViewById(R.id.chat)
                  progress = findViewById(R.id.progress)
                  loss = findViewById(R.id.loss)
                  fileInfo = findViewById(R.id.fileInfo)

                  val input = findViewById<EditText>(R.id.input)
                  val send = findViewById<Button>(R.id.send)
                  val train = findViewById<Button>(R.id.trainButton)
                  val load = findViewById<Button>(R.id.loadButton)

                  chat.text = "JsAI Neural Engine v2.0 Ready\n"

                  load.setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          type = "text/*"
                          putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      }
                      startActivityForResult(intent, PICK_FILES)
                  }

                  train.setOnClickListener {
                      if (!isTraining && datasetText.isNotEmpty()) startTraining()
                  }

                  send.setOnClickListener {
                      val prompt = input.text.toString()
                      if (prompt.isNotEmpty()) {
                          chat.append("\n> $prompt\n")
                          input.setText("")
                          CoroutineScope(Dispatchers.Main).launch {
                              val gen = withContext(Dispatchers.IO) { generateText(prompt) }
                              chat.append("JsAI: $gen\n")
                          }
                      }
                  }
              }

              private fun startTraining() {
                  isTraining = true
                  CoroutineScope(Dispatchers.Main).launch {
                      chat.append("\n[TRAINING STARTED...]\n")
                      val tokens = withContext(Dispatchers.IO) {
                          datasetText.lowercase().split(Regex("\\s+")).filter { it.isNotBlank() }
                      }
                      transitionMatrix.clear()
                      for (i in 0 until tokens.size - 1) {
                          val cur = tokens[i]; val nxt = tokens[i+1]
                          transitionMatrix.getOrPut(cur) { mutableMapOf() }[nxt] = (transitionMatrix[cur]?.get(nxt) ?: 0) + 1
                      }
                      isTraining = false
                      chat.append("[COMPLETE: ${transitionMatrix.size} states]\n")
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_FILES && resultCode == Activity.RESULT_OK) {
                      val sb = StringBuilder()
                      data?.clipData?.let { cd ->
                          for (i in 0 until cd.itemCount) sb.append(readText(cd.getItemAt(i).uri))
                      } ?: data?.data?.let { uri -> sb.append(readText(uri)) }
                      datasetText = sb.toString()
                      fileInfo.text = "Size: ${datasetText.length} chars"
                  }
              }

              private fun readText(uri: Uri): String = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""

              private fun generateText(prompt: String): String {
                  var current = prompt.lowercase().split(" ").last()
                  val res = mutableListOf<String>()
                  repeat(20) {
                      val nexts = transitionMatrix[current] ?: return@repeat
                      val word = nexts.maxByOrNull { it.value }?.key ?: ""
                      if (word.isNotEmpty()) { res.add(word); current = word }
                  }
                  return res.joinToString(" ")
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JsAI-Neural-Engine
          path: app/build/outputs/apk/debug/app-debug.apk
