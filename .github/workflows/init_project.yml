name: AetheriaOS - Full System Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aetheria-os:
    name: Build AetheriaOS (APK + Boot Image)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Android SDK & Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          override: true
          components: rust-src
      
      # ===== 1. СОЗДАЁМ ЯДРО AETHERIAOS (Rust) С ТЕРМИНАЛОМ =====
      - name: Create & Build Rust Kernel
        run: |
          mkdir -p aetheria_kernel/src
          
          cat > aetheria_kernel/src/lib.rs << 'EOF'
          #![no_std]
          
          use core::panic::PanicInfo;
          use core::ptr::write_volatile;
          
          #[panic_handler]
          fn panic(_info: &PanicInfo) -> ! {
              loop { core::hint::spin_loop(); }
          }
          
          #[no_mangle]
          pub unsafe extern "C" fn memset(dest: *mut u8, c: i32, n: usize) -> *mut u8 {
              for i in 0..n { *dest.add(i) = c as u8; }
              dest
          }
          
          #[no_mangle]
          pub unsafe extern "C" fn memcpy(dest: *mut u8, src: *const u8, n: usize) -> *mut u8 {
              for i in 0..n { *dest.add(i) = *src.add(i); }
              dest
          }
          
          // --- ГРАФИЧЕСКИЙ ДРАЙВЕР И ТЕРМИНАЛ ---
          fn draw_rect(fb: *mut u32, fb_w: u32, x: u32, y: u32, w: u32, h: u32, color: u32) {
              for iy in y..(y+h) {
                  for ix in x..(x+w) {
                      unsafe { write_volatile(fb.add((iy * fb_w + ix) as usize), color); }
                  }
              }
          }
          
          // Симуляция текста (рисует пиксельные "строки" кода для красоты терминала)
          fn draw_pseudo_text(fb: *mut u32, fb_w: u32, x: u32, y: u32, length: u32, color: u32) {
              let mut cx = x;
              let mut seed = length * y; 
              for _ in 0..length {
                  seed = (seed * 1103515245 + 12345) % 2147483648;
                  let word_len = 10 + (seed % 40) as u32;
                  draw_rect(fb, fb_w, cx, y, word_len, 10, color);
                  cx += word_len + 8;
              }
          }
          
          // НОВАЯ ТОЧКА ВХОДА (Смещение 0x0)
          #[no_mangle]
          #[link_section = ".text.entry"]
          pub extern "C" fn aetheria_main(fb_addr: *mut u32, width: u32, height: u32) -> ! {
              // ИСПРАВЛЕНО: Добавлен суффикс u32, чтобы компилятор не ругался на переполнение
              let bg = 0xFF0D0D14u32;      
              let green = 0xFF4AF626u32;   
              let white = 0xFFFFFFFFu32;   
              let blue = 0xFF89B4FAu32;
              
              // 1. Очистка экрана
              draw_rect(fb_addr, width, 0, 0, width, height, bg);
              
              let mut cursor_y = 40;
              
              // 2. Анимация загрузки ядра (выводим "логи")
              for i in 0..15 {
                  draw_pseudo_text(fb_addr, width, 20, cursor_y, 5 + (i % 4), white);
                  draw_rect(fb_addr, width, 20, cursor_y, 40, 10, green); // Метка [ OK ]
                  cursor_y += 20;
                  
                  // Задержка для эффекта "печатания"
                  for _ in 0..4000000 { core::hint::spin_loop(); }
              }
              
              // 3. Вывод интерфейса
              cursor_y += 30;
              // Рисуем логотип-блок
              draw_rect(fb_addr, width, 20, cursor_y, 250, 40, blue); 
              cursor_y += 60;
              
              // 4. Появление командной строки "root@aetheria:~#"
              draw_rect(fb_addr, width, 20, cursor_y, 150, 15, green); // root@aetheria
              draw_rect(fb_addr, width, 180, cursor_y, 80, 15, white); // команда
              
              // Мигающий курсор терминала
              let mut tick = 0;
              loop {
                  let cursor_color = if (tick / 50) % 2 == 0 { white } else { bg };
                  draw_rect(fb_addr, width, 270, cursor_y, 10, 15, cursor_color);
                  
                  tick += 1;
                  for _ in 0..100000 { core::hint::spin_loop(); } 
              }
          }
          EOF
          
          cat > aetheria_kernel/linker.ld << 'EOF'
          ENTRY(aetheria_main);
          SECTIONS {
              . = 0x00000000;
              .text : { *(.text.entry) *(.text*) }
              .rodata : { *(.rodata*) }
              .data : { *(.data*) }
              .bss : { *(.bss*) *(COMMON) }
              /DISCARD/ : { *(.eh_frame) *(.comment) }
          }
          EOF
          
          cat > aetheria_kernel/Cargo.toml << 'EOF'
          [package]
          name = "aetheria_kernel"
          version = "0.1.0"
          edition = "2021"
          [lib]
          crate-type = ["staticlib"]
          [profile.release]
          opt-level = 3
          panic = "abort"
          EOF
          
          cd aetheria_kernel
          cargo build --release --target aarch64-unknown-none
          LLD=$(find $ANDROID_HOME/ndk -name "ld.lld" | head -n 1)
          OBJCOPY=$(find $ANDROID_HOME/ndk -name "llvm-objcopy" | head -n 1)
          $LLD -T linker.ld -o kernel.elf target/aarch64-unknown-none/release/libaetheria_kernel.a
          $OBJCOPY -O binary kernel.elf kernel.bin
          cd ..
      
      # ===== 2. СОЗДАЁМ ИНТЕРФЕЙС АНДРОИДА =====
      - name: Create Android Wrapper
        run: |
          mkdir -p app/src/main/{java/com/aetheria/loader,cpp,res/values,res/raw}
          cp aetheria_kernel/kernel.bin app/src/main/res/raw/kernel_bin
          
          cat > app/src/main/java/com/aetheria/loader/MainActivity.java << 'EOF'
          package com.aetheria.loader;
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.*;
          import android.view.SurfaceView;
          import android.view.SurfaceHolder;
          import java.nio.ByteBuffer;
          
          public class MainActivity extends Activity {
              static { System.loadLibrary("aetheria_loader"); }
              private native void startKernel(byte[] kernelData, ByteBuffer frameBuffer, int width, int height);
              
              private SurfaceView surface;
              private ByteBuffer frameBuffer;
              private Bitmap bitmap;
              private final int WIDTH = 1280;
              private final int HEIGHT = 720;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  surface = new SurfaceView(this);
                  setContentView(surface);
                  
                  frameBuffer = ByteBuffer.allocateDirect(WIDTH * HEIGHT * 4);
                  bitmap = Bitmap.createBitmap(WIDTH, HEIGHT, Bitmap.Config.ARGB_8888);
                  
                  surface.getHolder().addCallback(new SurfaceHolder.Callback() {
                      @Override
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> {
                              try {
                                  byte[] kernel = getResources().openRawResource(R.raw.kernel_bin).readAllBytes();
                                  startKernel(kernel, frameBuffer, WIDTH, HEIGHT);
                              } catch(Exception e) { e.printStackTrace(); }
                          }).start();
                          
                          new Thread(() -> {
                              while(true) {
                                  Canvas c = h.lockCanvas();
                                  if (c != null) {
                                      frameBuffer.position(0);
                                      bitmap.copyPixelsFromBuffer(frameBuffer);
                                      c.drawBitmap(bitmap, null, new Rect(0,0, surface.getWidth(), surface.getHeight()), null);
                                      h.unlockCanvasAndPost(c);
                                  }
                                  try { Thread.sleep(16); } catch(Exception e){}
                              }
                          }).start();
                      }
                      @Override public void surfaceChanged(SurfaceHolder h, int f, int w, int h2) {}
                      @Override public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }
          }
          EOF
          
          cat > app/src/main/cpp/loader.cpp << 'EOF'
          #include <jni.h>
          #include <sys/mman.h>
          #include <cstring>
          #include <android/log.h>
          
          extern "C" JNIEXPORT void JNICALL
          Java_com_aetheria_loader_MainActivity_startKernel(JNIEnv* env, jobject, jbyteArray kernelData, jobject fb, jint w, jint h) {
              jsize len = env->GetArrayLength(kernelData);
              jbyte* bytes = env->GetByteArrayElements(kernelData, nullptr);
              void* fb_ptr = env->GetDirectBufferAddress(fb);
              
              void* exec_mem = mmap(nullptr, len, PROT_READ | PROT_WRITE | PROT_EXEC, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
              memcpy(exec_mem, bytes, len);
              __builtin___clear_cache((char*)exec_mem, (char*)exec_mem + len);
              
              typedef void (*KernelMain)(void*, uint32_t, uint32_t);
              KernelMain kmain = (KernelMain)exec_mem;
              kmain(fb_ptr, w, h);
              
              env->ReleaseByteArrayElements(kernelData, bytes, JNI_ABORT);
          }
          EOF
          
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aetheria_loader)
          add_library(aetheria_loader SHARED loader.cpp)
          target_link_libraries(aetheria_loader log)
          target_compile_options(aetheria_loader PRIVATE -O3 -fPIC)
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="AetheriaOS" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name="com.aetheria.loader.MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.aetheria.loader'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.aetheria.loader'
                  minSdk 24
                  targetSdk 34
                  externalNativeBuild { cmake { cppFlags "-O3 -fPIC" } }
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
          }
          EOF
          
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          echo 'include ":app"' > settings.gradle

      # ===== 3. СБОРКА APK =====
      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --no-daemon

      # ===== 4. СОЗДАНИЕ НАСТОЯЩЕГО ПРОШИВОЧНОГО BOOT.IMG =====
      - name: Create boot.img (Hardware OS)
        run: |
          mkdir -p hardware_build
          
          sudo apt-get update
          sudo apt-get install -y mkbootimg
          
          echo "AetheriaOS Initial Ramdisk" > hardware_build/init
          gzip -c hardware_build/init > hardware_build/ramdisk.gz
          
          mkbootimg --kernel aetheria_kernel/kernel.bin \
                    --ramdisk hardware_build/ramdisk.gz \
                    --cmdline "console=ttyMSM0,115200n8 earlycon=msm_geni_serial" \
                    --base 0x10000000 \
                    --pagesize 2048 \
                    -o boot.img
                      
          cat > README_FLASHING.txt << 'EOF'
          =======================================
               AETHERIA OS - РЕЛИЗНЫЙ ПАКЕТ
          =======================================
          
          В архиве находятся:
          
          1. AetheriaOS-Virtual.apk
             Установите это на Android! Вы увидите РЕАЛЬНЫЙ процесс загрузки, 
             строки логов терминала и мигающий курсор командной строки!
             Всё это рисует голое ядро на Rust.
             
          2. kernel.bin
             Сырой машинный код вашей ОС.
             
          3. boot.img
             Прошиваемый образ загрузчика Android.
          EOF

      # ===== 5. ПАКУЕМ ВСЁ В АРХИВ =====
      - name: Package Release
        run: |
          mkdir -p AetheriaOS_Release
          cp app/build/outputs/apk/debug/app-debug.apk AetheriaOS_Release/AetheriaOS-Virtual.apk
          cp aetheria_kernel/kernel.bin AetheriaOS_Release/kernel.bin
          cp boot.img AetheriaOS_Release/boot.img
          cp README_FLASHING.txt AetheriaOS_Release/README_FLASHING.txt
          
          cd AetheriaOS_Release
          zip -r ../AetheriaOS-Ultimate-Build.zip *
          
      - name: Upload OS Package
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-Ultimate
          path: AetheriaOS-Ultimate-Build.zip
          retention-days: 30
