              [0x7E,0x60,0x60,0x78,0x60,0x60,0x60,0x00], [0x3C,0x66,0x60,0x6E,0x66,0x66,0x3E,0x00],
              [0x66,0x66,0x66,0x7E,0x66,0x66,0x66,0x00], [0x3E,0x18,0x18,0x18,0x18,0x18,0x3E,0x00],
              [0x0F,0x06,0x06,0x06,0x66,0x66,0x3C,0x00], [0x66,0x6C,0x78,0x70,0x78,0x6C,0x66,0x00],
              [0x60,0x60,0x60,0x60,0x60,0x60,0x7E,0x00], [0x63,0x77,0x7F,0x6B,0x63,0x63,0x63,0x00],
              [0x66,0x76,0x7E,0x7E,0x6E,0x66,0x66,0x00], [0x3C,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],
              [0x7C,0x66,0x66,0x7C,0x60,0x60,0x60,0x00], [0x3C,0x66,0x66,0x66,0x66,0x3C,0x0E,0x00],
              [0x7C,0x66,0x66,0x7C,0x78,0x6C,0x66,0x00], [0x3C,0x66,0x60,0x3C,0x06,0x66,0x3C,0x00],
              [0x7E,0x18,0x18,0x18,0x18,0x18,0x18,0x00], [0x66,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],
              [0x66,0x66,0x66,0x66,0x66,0x3C,0x18,0x00], [0x63,0x63,0x6B,0x7F,0x77,0x63,0x63,0x00],
              [0x66,0x66,0x3C,0x18,0x3C,0x66,0x66,0x00], [0x66,0x66,0x66,0x3C,0x18,0x18,0x18,0x00],
              [0x7E,0x06,0x0C,0x18,0x30,0x60,0x7E,0x00], [0x3C,0x30,0x30,0x30,0x30,0x30,0x3C,0x00],
              [0x00,0x60,0x30,0x18,0x0C,0x06,0x00,0x00], [0x3C,0x0C,0x0C,0x0C,0x0C,0x0C,0x3C,0x00],
              [0x18,0x3C,0x66,0x00,0x00,0x00,0x00,0x00], [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xFF],
              [0x30,0x18,0x0C,0x00,0x00,0x00,0x00,0x00], [0x00,0x00,0x3C,0x06,0x3E,0x66,0x3E,0x00],
              [0x60,0x60,0x7C,0x66,0x66,0x66,0x7C,0x00], [0x00,0x00,0x3C,0x60,0x60,0x60,0x3C,0x00],
              [0x06,0x06,0x3E,0x66,0x66,0x66,0x3E,0x00], [0x00,0x00,0x3C,0x66,0x7E,0x60,0x3C,0x00],
              [0x1C,0x30,0x7C,0x30,0x30,0x30,0x30,0x00], [0x00,0x00,0x3E,0x66,0x66,0x3E,0x06,0x3C],
              [0x60,0x60,0x7C,0x66,0x66,0x66,0x66,0x00], [0x18,0x00,0x38,0x18,0x18,0x18,0x3C,0x00],
              [0x0C,0x00,0x1C,0x0C,0x0C,0x0C,0x0C,0x38], [0x60,0x60,0x66,0x6C,0x78,0x6C,0x66,0x00],
              [0x38,0x18,0x18,0x18,0x18,0x18,0x3C,0x00], [0x00,0x00,0x6C,0xFE,0xD6,0xD6,0xC6,0x00],
              [0x00,0x00,0x7C,0x66,0x66,0x66,0x66,0x00], [0x00,0x00,0x3C,0x66,0x66,0x66,0x3C,0x00],
              [0x00,0x00,0x7C,0x66,0x66,0x7C,0x60,0x60], [0x00,0x00,0x3E,0x66,0x66,0x3E,0x06,0x06],
              [0x00,0x00,0x7C,0x66,0x60,0x60,0x60,0x00], [0x00,0x00,0x3C,0x60,0x3C,0x06,0x3C,0x00],
              [0x30,0x30,0x7C,0x30,0x30,0x30,0x1C,0x00], [0x00,0x00,0x66,0x66,0x66,0x66,0x3E,0x00],
              [0x00,0x00,0x66,0x3C,0x18,0x3C,0x66,0x00], [0x00,0x00,0xC6,0xD6,0xD6,0xFE,0x6C,0x00],
              [0x00,0x00,0x66,0x3C,0x18,0x3C,0x66,0x00], [0x00,0x00,0x66,0x66,0x66,0x3E,0x06,0x3C],
              [0x00,0x00,0x7E,0x0C,0x18,0x30,0x7E,0x00], [0x0E,0x18,0x18,0x70,0x18,0x18,0x0E,0x00],
              [0x18,0x18,0x18,0x00,0x18,0x18,0x18,0x00], [0x70,0x18,0x18,0x0E,0x18,0x18,0x70,0x00],
              [0x3A,0x6E,0x00,0x00,0x00,0x00,0x00,0x00]
          ];
          EOF
          
          # 2. ЯДРО С КОМАНДОЙ INFO
          cat > aetheria_kernel/src/lib.rs << 'EOF'
          #![no_std]
          mod font;
          use core::panic::PanicInfo;
          use core::ptr::{read_volatile, write_volatile};
          use core::str;
          
          #[panic_handler] fn panic(_info: &PanicInfo) -> ! { loop { core::hint::spin_loop(); } }
          
          struct VFile { name: &'static str, content: &'static str }
          const FILESYSTEM: [VFile; 3] = [
              VFile { name: "readme.txt", content: "AetheriaOS v0.5 - Experimental Shell." },
              VFile { name: "credits.txt", content: "Creators: Dmitry Gustenev & AI." },
              VFile { name: "system.vfs", content: "Virtual RAM FileSystem mounted." },
          ];

          fn draw_rect(fb: *mut u32, fb_w: u32, x: u32, y: u32, w: u32, h: u32, color: u32) {
              for iy in y..(y+h) {
                  for ix in x..(x+w) { unsafe { write_volatile(fb.add((iy * fb_w + ix) as usize), color); } }
              }
          }
          
          fn draw_char(fb: *mut u32, fb_w: u32, x: u32, y: u32, c: char, color: u32, scale: u32) {
              let bitmap = font::get_char_bitmap(c);
              for row in 0..8 {
                  for col in 0..8 {
                      if (bitmap[row] & (1 << (7 - col))) != 0 {
                          draw_rect(fb, fb_w, x + col * scale, y + (row as u32) * scale, scale, scale, color);
                      }
                  }
              }
          }
          
          fn draw_text(fb: *mut u32, fb_w: u32, x: u32, y: u32, text: &str, color: u32, scale: u32) {
              let mut cx = x;
              for c in text.chars() { draw_char(fb, fb_w, cx, y, c, color, scale); cx += 8 * scale; }
          }

          #[no_mangle]
          #[link_section = ".text.entry"]
          pub extern "C" fn aetheria_main(fb_addr: *mut u32, kb_addr: *mut u8, width: u32, height: u32) -> ! {
              let bg = 0xFF0D0D14;
              let white = 0xFFFFFFFF;
              let green = 0xFF4AF626;
              let red = 0xFFF38BA8;
              
              let mut cursor_y = 20;
              let scale = 2;
              let (f_w, f_h) = (8*scale, 8*scale);
              
              draw_rect(fb_addr, width, 0, 0, width, height, bg);
              draw_text(fb_addr, width, 20, cursor_y, "AetheriaOS v0.5 - Welcome", white, scale);
              cursor_y += f_h + 10;
              
              let prompt = "root@aetheria:~# ";
              let mut input_buf = [0u8; 64];
              let mut input_len = 0;
              let mut tick: u32 = 0;

              draw_text(fb_addr, width, 20, cursor_y, prompt, white, scale);
              
              loop {
                  let key = unsafe { read_volatile(kb_addr) };
                  if key != 0 {
                      unsafe { write_volatile(kb_addr, 0); }
                      if key == 10 { // ENTER
                          cursor_y += f_h + 5;
                          if let Ok(full_cmd) = str::from_utf8(&input_buf[..input_len]) {
                              let trimmed = full_cmd.trim();
                              let mut parts = trimmed.splitn(2, ' ');
                              let cmd = parts.next().unwrap_or("");
                              let arg = parts.next().unwrap_or("");

                              match cmd {
                                  "help" => { draw_text(fb_addr, width, 20, cursor_y, "ls, cat, info, clear, uname", white, scale); cursor_y += f_h + 5; },
                                  "ls" => {
                                      for f in FILESYSTEM.iter() {
                                          draw_text(fb_addr, width, 20, cursor_y, f.name, green, scale);
                                          cursor_y += f_h + 5;
                                      }
                                  },
                                  "info" => {
                                      draw_text(fb_addr, width, 20, cursor_y, "Creators: Dmitry Gustenev & AI", green, scale);
                                      cursor_y += f_h + 5;
                                      draw_text(fb_addr, width, 20, cursor_y, "Made with love!", red, scale);
                                      cursor_y += f_h + 10;
                                      draw_text(fb_addr, width, 20, cursor_y, "Thanks to LMArena (AI provider)", white, scale);
                                      cursor_y += f_h + 5;
                                      draw_text(fb_addr, width, 20, cursor_y, "Thanks to Chips for support!", white, scale);
                                      cursor_y += f_h + 5;
                                  },
                                  "cat" => {
                                      let mut found = false;
                                      for f in FILESYSTEM.iter() {
                                          if f.name == arg {
                                              draw_text(fb_addr, width, 20, cursor_y, f.content, white, scale);
                                              found = true; break;
                                          }
                                      }
                                      if !found { draw_text(fb_addr, width, 20, cursor_y, "Not found", red, scale); }
                                      cursor_y += f_h + 5;
                                  },
                                  "clear" => { draw_rect(fb_addr, width, 0, 0, width, height, bg); cursor_y = 20; },
                                  "uname" => { draw_text(fb_addr, width, 20, cursor_y, "AetheriaOS v0.5-aarch64", white, scale); cursor_y += f_h + 5; },
                                  "" => {},
                                  _ => { draw_text(fb_addr, width, 20, cursor_y, "Unknown command", red, scale); cursor_y += f_h + 5; }
                              }
                          }
                          input_len = 0;
                          if cursor_y > height - 100 { draw_rect(fb_addr, width, 0, 0, width, height, bg); cursor_y = 20; }
                          draw_text(fb_addr, width, 20, cursor_y, prompt, white, scale);
                      } else if key == 8 { // BACKSPACE
                          if input_len > 0 {
                              input_len -= 1;
                              draw_rect(fb_addr, width, 20 + (prompt.len() as u32 + input_len as u32)*f_w, cursor_y, f_w, f_h, bg);
                          }
                      } else if input_len < 64 && key >= 32 && key <= 126 {
                          input_buf[input_len] = key;
                          draw_char(fb_addr, width, 20 + (prompt.len() as u32 + input_len as u32)*f_w, cursor_y, key as char, white, scale);
                          input_len += 1;
                      }
                  }
                  let cursor_x = 20 + (prompt.len() as u32 + input_len as u32)*f_w;
                  let cursor_color = if (tick / 50) % 2 == 0 { white } else { bg };
                  draw_rect(fb_addr, width, cursor_x, cursor_y + f_h - 4, f_w, 4, cursor_color);
                  tick = tick.wrapping_add(1);
                  for _ in 0..100_000 { core::hint::spin_loop(); }
              }
          }
          EOF

          # 3. BUILD
          cat > aetheria_kernel/linker.ld << 'EOF'
          ENTRY(aetheria_main);
          SECTIONS {
              . = 0x00000000;
              .text : { *(.text.entry) *(.text*) }
              .rodata : { *(.rodata*) }
              .data : { *(.data*) }
              .bss : { *(.bss*) *(COMMON) }
          }
          EOF
          cat > aetheria_kernel/Cargo.toml << 'EOF'
          [package]
          name = "aetheria_kernel"
          version = "0.1.0"
          edition = "2021"
          [lib]
          crate-type = ["staticlib"]
          [profile.release]
          opt-level = 3
          panic = "abort"
          EOF

          cd aetheria_kernel
          cargo build --release --target aarch64-unknown-none
          LLD=$(find $ANDROID_HOME/ndk -name "ld.lld" | head -n 1)
          OBJCOPY=$(find $ANDROID_HOME/ndk -name "llvm-objcopy" | head -n 1)
          $LLD -T linker.ld -o kernel.elf target/aarch64-unknown-none/release/libaetheria_kernel.a
          $OBJCOPY -O binary kernel.elf kernel.bin
          cd ..

      - name: Create Android Wrapper
        run: |
          mkdir -p app/src/main/{java/com/aetheria/loader,cpp,res/values,res/raw}
          cp aetheria_kernel/kernel.bin app/src/main/res/raw/kernel_bin
          
          cat > app/src/main/java/com/aetheria/loader/MainActivity.java << 'EOF'
          package com.aetheria.loader;
          import android.app.Activity;
          import android.content.Context;
          import android.os.Bundle;
          import android.graphics.*;
          import android.view.*;
          import android.view.inputmethod.InputMethodManager;
          import java.nio.ByteBuffer;

          public class MainActivity extends Activity {
              static { System.loadLibrary("aetheria_loader"); }
              private native void startKernel(byte[] k, ByteBuffer fb, ByteBuffer kb, int w, int h);
              private ByteBuffer fb, kb; private Bitmap bmp;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  SurfaceView sv = new SurfaceView(this); setContentView(sv);
                  fb = ByteBuffer.allocateDirect(1280*720*4); kb = ByteBuffer.allocateDirect(1);
                  bmp = Bitmap.createBitmap(1280, 720, Bitmap.Config.ARGB_8888);
                  sv.setFocusable(true); sv.setFocusableInTouchMode(true); sv.requestFocus();
                  
                  sv.setOnTouchListener((v, event) -> {
                      if(event.getAction() == MotionEvent.ACTION_DOWN) {
                          sv.requestFocus();
                          InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                          imm.showSoftInput(sv, InputMethodManager.SHOW_FORCED);
                      }
                      return true;
                  });

                  sv.setOnKeyListener((v, kc, e) -> {
                      if(e.getAction() == KeyEvent.ACTION_DOWN) {
                          int c = e.getUnicodeChar();
                          if(kc == KeyEvent.KEYCODE_DEL) c = 8;
                          if(kc == KeyEvent.KEYCODE_ENTER) c = 10;
                          if(c != 0) kb.put(0, (byte)c);
                      }
                      return true;
                  });

                  sv.getHolder().addCallback(new SurfaceHolder.Callback() {
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> {
                              try { byte[] k = getResources().openRawResource(R.raw.kernel_bin).readAllBytes();
                              startKernel(k, fb, kb, 1280, 720); } catch(Exception e){}
                          }).start();
                          new Thread(() -> {
                              while(true) { Canvas c = h.lockCanvas(); if(c!=null){ fb.position(0); bmp.copyPixelsFromBuffer(fb);
                              c.drawBitmap(bmp, null, new Rect(0,0,sv.getWidth(),sv.getHeight()), null); h.unlockCanvasAndPost(c); }
                              try{Thread.sleep(16);}catch(Exception e){}}
                          }).start();
                      }
                      public void surfaceChanged(SurfaceHolder h, int f, int w, int h2){}
                      public void surfaceDestroyed(SurfaceHolder h){}
                  });
              }
          }
          EOF

          cat > app/src/main/cpp/loader.cpp << 'EOF'
          #include <jni.h>
          #include <sys/mman.h>
          #include <cstring>
          extern "C" JNIEXPORT void JNICALL Java_com_aetheria_loader_MainActivity_startKernel(JNIEnv* env, jobject, jbyteArray kdata, jobject fb, jobject kb, jint w, jint h) {
              jsize len = env->GetArrayLength(kdata); jbyte* b = env->GetByteArrayElements(kdata, 0);
              void* m = mmap(0, len, PROT_READ|PROT_WRITE|PROT_EXEC, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0);
              memcpy(m, b, len); __builtin___clear_cache((char*)m, (char*)m+len);
              ((void(*)(void*, void*, int, int))m)(env->GetDirectBufferAddress(fb), env->GetDirectBufferAddress(kb), w, h);
          }
          EOF

          echo 'cmake_minimum_required(VERSION 3.22)' > app/src/main/cpp/CMakeLists.txt
          echo 'project(aetheria_loader)' >> app/src/main/cpp/CMakeLists.txt
          echo 'add_library(aetheria_loader SHARED loader.cpp)' >> app/src/main/cpp/CMakeLists.txt
          echo 'target_link_libraries(aetheria_loader log)' >> app/src/main/cpp/CMakeLists.txt

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aetheria.loader">
              <application android:label="AetheriaOS" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.aetheria.loader'; compileSdk 34
              defaultConfig { applicationId 'com.aetheria.loader'; minSdk 24; targetSdk 34
                  externalNativeBuild { cmake { cppFlags "-O3 -fPIC" } } }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } } }
          EOF
          echo 'buildscript { repositories { google(); mavenCentral() }; dependencies { classpath "com.android.tools.build:gradle:8.2.2" } }' > build.gradle
          echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle
          echo 'include ":app"' > settings.gradle

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-Release
          path: app/build/outputs/apk/debug/app-debug.apk
