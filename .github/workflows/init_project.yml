name: MadGPT Turbo-Max Mobile

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project Structure
        run: |

          mkdir -p app/src/main/java/com/madgpt/turbo
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # -------------------------
          # settings.gradle
          # -------------------------
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MadGPTTurbo"
          include(":app")
          EOF

          # -------------------------
          # Root build.gradle (repositories BACK)
          # -------------------------
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          EOF

          # -------------------------
          # gradle.properties
          # -------------------------
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # -------------------------
          # app/build.gradle
          # -------------------------
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.madgpt.turbo'
              compileSdk 34

              defaultConfig {
                  applicationId "com.madgpt.turbo"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "7.0-TURBO"
                  ndk { abiFilters 'arm64-v8a' }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'

              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
          }
          EOF

          # -------------------------
          # resources
          # -------------------------
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">MadGPT Turbo</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.MadGPTTurbo" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#000000"
              android:padding="12dp">

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="ENGINE ONLINE"
                  android:textColor="#00FF41"
                  android:textSize="12sp"
                  android:fontFamily="monospace"/>

              <TextView
                  android:id="@+id/chat"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:textColor="#FFFFFF"
                  android:fontFamily="monospace"
                  android:textSize="15sp"/>

              <EditText
                  android:id="@+id/input"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Введите текст..."
                  android:textColor="#FFFFFF"
                  android:textColorHint="#333333"
                  android:background="#111111"
                  android:padding="12dp"/>

              <Button
                  android:id="@+id/send"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="EXECUTE"
                  android:backgroundTint="#00FF41"
                  android:textColor="#000000"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/madgpt/turbo/MainActivity.kt << 'EOF'
          package com.madgpt.turbo

          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val chat = findViewById<TextView>(R.id.chat)
                  val input = findViewById<EditText>(R.id.input)

                  findViewById<Button>(R.id.send).setOnClickListener {
                      val text = input.text.toString()
                      chat.append("\n> $text\n")
                      input.setText("")

                      CoroutineScope(Dispatchers.Default).launch {
                          delay(400)
                          withContext(Dispatchers.Main) {
                              chat.append("Ответ: Система работает стабильно.\n")
                          }
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="MadGPT Turbo"
                  android:theme="@style/Theme.MadGPTTurbo">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadGPT-Turbo-Edition
          path: app/build/outputs/apk/debug/app-debug.apk
