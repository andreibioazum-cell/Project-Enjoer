name: AetheriaOS - Interactive Shell
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aetheria-os:
    name: Build AetheriaOS (Interactive)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Android SDK & Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          override: true
          components: rust-src
          
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Generate Rust Font (ASCII + Cyrillic)
        run: |
          mkdir -p aetheria_kernel/src
          cat > generate_font.py << 'EOF'
          import urllib.request, re
          def get_font(url):
              req = urllib.request.urlopen(url)
              content = req.read().decode('utf-8')
              matches = re.findall(r'\{([^}]+)\}', content)
              res = []
              for m in matches:
                  try:
                      b = [int(x.strip(), 16) for x in m.split(',') if x.strip()]
                      if len(b) == 8: res.append(b)
                  except: pass
              return res
          basic = get_font("https://raw.githubusercontent.com/dhepper/font8x8/master/font8x8_basic.h")
          cyrillic = get_font("https://raw.githubusercontent.com/dhepper/font8x8/master/font8x8_cyrillic.h")
          with open("aetheria_kernel/src/font.rs", "w") as f:
              f.write("pub fn get_char_bitmap(c: char) -> [u8; 8] {\n")
              f.write("    match c as u32 {\n")
              for i, bmp in enumerate(basic): f.write(f"        {i} => {bmp},\n")
              for i, bmp in enumerate(cyrillic): f.write(f"        {0x0400 + i} => {bmp},\n")
              f.write("        _ => [0xFF; 8],\n    }\n}\n")
          EOF
          python3 generate_font.py
      
      # ===== 1. СОЗДАЁМ ЯДРО AETHERIAOS (Rust) С ИНТЕРАКТИВНОЙ ОБОЛОЧКОЙ =====
      - name: Create & Build Rust Kernel
        run: |
          cat > aetheria_kernel/src/lib.rs << 'EOF'
          #![no_std]
          
          mod font;
          
          use core::panic::PanicInfo;
          use core::ptr::{read_volatile, write_volatile};
          use core::str;
          
          #[panic_handler]
          fn panic(_info: &PanicInfo) -> ! { loop { core::hint::spin_loop(); } }
          
          #[no_mangle] pub unsafe extern "C" fn memset(dest: *mut u8, c: i32, n: usize) -> *mut u8 { for i in 0..n { *dest.add(i) = c as u8; } dest }
          #[no_mangle] pub unsafe extern "C" fn memcpy(dest: *mut u8, src: *const u8, n: usize) -> *mut u8 { for i in 0..n { *dest.add(i) = *src.add(i); } dest }
          
          // --- ГРАФИКА ---
          fn draw_rect(fb: *mut u32, fb_w: u32, x: u32, y: u32, w: u32, h: u32, color: u32) {
              for iy in y..(y+h) {
                  for ix in x..(x+w) {
                      unsafe { write_volatile(fb.add((iy * fb_w + ix) as usize), color); }
                  }
              }
          }
          
          fn draw_char(fb: *mut u32, fb_w: u32, x: u32, y: u32, c: char, color: u32, scale: u32) {
              let bitmap = font::get_char_bitmap(c);
              for row in 0..8 {
                  for col in 0..8 {
                      if (bitmap[row] & (1 << col)) != 0 {
                          draw_rect(fb, fb_w, x + col * scale, y + (row as u32) * scale, scale, scale, color);
                      }
                  }
              }
          }
          
          fn draw_text(fb: *mut u32, fb_w: u32, x: u32, y: u32, text: &str, color: u32, scale: u32) {
              let mut cx = x;
              for c in text.chars() {
                  draw_char(fb, fb_w, cx, y, c, color, scale);
                  cx += 8 * scale;
              }
          }
          
          // --- ВИРТУАЛЬНАЯ ФАЙЛОВАЯ СИСТЕМА (VFS) ---
          struct VFile { name: &'static str, content: &'static str }
          const FILESYSTEM: [VFile; 2] = [
              VFile { name: "readme.txt", content: "Welcome to AetheriaOS!\nThis is a bare-metal OS written in Rust.\nEnjoy your stay!" },
              VFile { name: "system.log", content: "[INIT] CPU OK\n[INIT] MEM OK\n[INIT] VFS OK\n" },
          ];
          
          // --- ТОЧКА ВХОДА (Добавлен kb_addr для клавиатуры) ---
          #[no_mangle]
          #[link_section = ".text.entry"]
          pub extern "C" fn aetheria_main(fb_addr: *mut u32, kb_addr: *mut u8, width: u32, height: u32) -> ! {
              let bg = 0xFF0D0D14u32;      
              let green = 0xFF4AF626u32;   
              let white = 0xFFFFFFFFu32;   
              let red = 0xFFF38BA8u32;
              
              let mut cursor_y = 20;
              let scale = 2;
              let font_w = 8 * scale;
              let font_h = 8 * scale;
              
              draw_rect(fb_addr, width, 0, 0, width, height, bg);
              draw_text(fb_addr, width, 20, cursor_y, "AetheriaOS v0.2 Interactive", green, scale);
              cursor_y += font_h + 10;
              
              let prompt = "root@aetheria:~# ";
              let prompt_len = prompt.len() as u32;
              
              let mut input_buf = [0u8; 64];
              let mut input_len = 0;
              
              // Функция печати новой строки (с прокруткой)
              let mut new_line = |cy: &mut u32| {
                  *cy += font_h + 5;
                  if *cy > height - 40 { // Простейшая очистка при переполнении
                      draw_rect(fb_addr, width, 0, 0, width, height, bg);
                      *cy = 20;
                  }
              };
              
              draw_text(fb_addr, width, 20, cursor_y, prompt, green, scale);
              
              let mut tick = 0;
              loop {
                  // Читаем байт с "аппаратной" клавиатуры Android
                  let key = unsafe { read_volatile(kb_addr) };
                  if key != 0 {
                      unsafe { write_volatile(kb_addr, 0); } // Очищаем буфер клавы
                      
                      if key == 10 { // ENTER
                          new_line(&mut cursor_y);
                          
                          // --- НАШ МИНИ-ИНТЕРПРЕТАТОР (SHELL) ---
                          if let Ok(cmd_str) = str::from_utf8(&input_buf[..input_len]) {
                              let cmd = cmd_str.trim();
                              if cmd == "help" {
                                  draw_text(fb_addr, width, 20, cursor_y, "Commands: help, ls, cat <file>, clear, calc <num+num>", white, scale);
                                  new_line(&mut cursor_y);
                              } else if cmd == "ls" {
                                  for file in FILESYSTEM.iter() {
                                      draw_text(fb_addr, width, 20, cursor_y, file.name, white, scale);
                                      new_line(&mut cursor_y);
                                  }
                              } else if cmd.starts_with("cat ") {
                                  let file_name = &cmd[4..];
                                  let mut found = false;
                                  for file in FILESYSTEM.iter() {
                                      if file.name == file_name {
                                          draw_text(fb_addr, width, 20, cursor_y, file.content, white, scale);
                                          new_line(&mut cursor_y);
                                          new_line(&mut cursor_y); // Под файл с переносами
                                          found = true;
                                          break;
                                      }
                                  }
                                  if !found {
                                      draw_text(fb_addr, width, 20, cursor_y, "File not found", red, scale);
                                      new_line(&mut cursor_y);
                                  }
                              } else if cmd == "clear" {
                                  draw_rect(fb_addr, width, 0, 0, width, height, bg);
                                  cursor_y = 20;
                              } else if cmd.starts_with("calc ") {
                                  // Мини-скрипт (Только сложение однозначных для демо)
                                  let expr = &cmd[5..];
                                  let bytes = expr.as_bytes();
                                  if bytes.len() >= 3 && bytes[1] == b'+' {
                                      let a = bytes[0] as i32 - 48;
                                      let b = bytes[2] as i32 - 48;
                                      if a>=0 && a<=9 && b>=0 && b<=9 {
                                          let sum = a + b;
                                          let res = [ (sum/10 + 48) as u8, (sum%10 + 48) as u8 ];
                                          draw_text(fb_addr, width, 20, cursor_y, "Result: ", white, scale);
                                          draw_text(fb_addr, width, 20 + 8*8*2, cursor_y, str::from_utf8(&res).unwrap_or(""), green, scale);
                                      } else { draw_text(fb_addr, width, 20, cursor_y, "Error", red, scale); }
                                  } else { draw_text(fb_addr, width, 20, cursor_y, "Format: calc 2+2", red, scale); }
                                  new_line(&mut cursor_y);
                              } else if cmd.len() > 0 {
                                  draw_text(fb_addr, width, 20, cursor_y, "Unknown command", red, scale);
                                  new_line(&mut cursor_y);
                              }
                          }
                          
                          input_len = 0;
                          draw_text(fb_addr, width, 20, cursor_y, prompt, green, scale);
                          
                      } else if key == 8 { // BACKSPACE
                          if input_len > 0 {
                              input_len -= 1;
                              let cursor_x = 20 + (prompt_len + input_len as u32) * font_w;
                              draw_rect(fb_addr, width, cursor_x, cursor_y, font_w, font_h, bg);
                          }
                      } else { // ОБЫЧНЫЙ СИМВОЛ
                          if input_len < 64 && key >= 32 && key <= 126 {
                              input_buf[input_len] = key;
                              let cursor_x = 20 + (prompt_len + input_len as u32) * font_w;
                              draw_char(fb_addr, width, cursor_x, cursor_y, key as char, white, scale);
                              input_len += 1;
                          }
                      }
                  }
                  
                  // Рисуем мигающий курсор
                  let cursor_x = 20 + (prompt_len + input_len as u32) * font_w;
                  let cursor_color = if (tick / 500) % 2 == 0 { white } else { bg };
                  draw_rect(fb_addr, width, cursor_x, cursor_y, font_w, 4, cursor_color);
                  
                  tick += 1;
              }
          }
          EOF
          
          cat > aetheria_kernel/linker.ld << 'EOF'
          ENTRY(aetheria_main);
          SECTIONS {
              . = 0x00000000;
              .text : { *(.text.entry) *(.text*) }
              .rodata : { *(.rodata*) }
              .data : { *(.data*) }
              .bss : { *(.bss*) *(COMMON) }
              /DISCARD/ : { *(.eh_frame) *(.comment) }
          }
          EOF
          
          cat > aetheria_kernel/Cargo.toml << 'EOF'
          [package]
          name = "aetheria_kernel"
          version = "0.1.0"
          edition = "2021"
          [lib]
          crate-type = ["staticlib"]
          [profile.release]
          opt-level = 3
          panic = "abort"
          EOF
          
          cd aetheria_kernel
          cargo build --release --target aarch64-unknown-none
          LLD=$(find $ANDROID_HOME/ndk -name "ld.lld" | head -n 1)
          OBJCOPY=$(find $ANDROID_HOME/ndk -name "llvm-objcopy" | head -n 1)
          $LLD -T linker.ld -o kernel.elf target/aarch64-unknown-none/release/libaetheria_kernel.a
          $OBJCOPY -O binary kernel.elf kernel.bin
          cd ..
      
      # ===== 2. СОЗДАЁМ ИНТЕРФЕЙС АНДРОИДА (С КЛАВИАТУРОЙ) =====
      - name: Create Android Wrapper
        run: |
          mkdir -p app/src/main/{java/com/aetheria/loader,cpp,res/values,res/raw}
          cp aetheria_kernel/kernel.bin app/src/main/res/raw/kernel_bin
          
          cat > app/src/main/java/com/aetheria/loader/MainActivity.java << 'EOF'
          package com.aetheria.loader;
          import android.app.Activity;
          import android.content.Context;
          import android.os.Bundle;
          import android.graphics.*;
          import android.view.*;
          import android.view.inputmethod.InputMethodManager;
          import java.nio.ByteBuffer;
          
          public class MainActivity extends Activity {
              static { System.loadLibrary("aetheria_loader"); }
              // Добавили kbBuffer для клавиатуры
              private native void startKernel(byte[] kernelData, ByteBuffer frameBuffer, ByteBuffer kbBuffer, int width, int height);
              
              private SurfaceView surface;
              private ByteBuffer frameBuffer;
              private ByteBuffer kbBuffer; 
              private Bitmap bitmap;
              private final int WIDTH = 1280;
              private final int HEIGHT = 720;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  surface = new SurfaceView(this);
                  setContentView(surface);
                  
                  frameBuffer = ByteBuffer.allocateDirect(WIDTH * HEIGHT * 4);
                  kbBuffer = ByteBuffer.allocateDirect(1); // 1 байт для передачи символа в Rust
                  bitmap = Bitmap.createBitmap(WIDTH, HEIGHT, Bitmap.Config.ARGB_8888);
                  
                  // Вызов экранной клавиатуры при нажатии на экран
                  surface.setFocusable(true);
                  surface.setFocusableInTouchMode(true);
                  surface.setOnTouchListener((v, e) -> {
                      surface.requestFocus();
                      InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      imm.showSoftInput(surface, InputMethodManager.SHOW_IMPLICIT);
                      return true;
                  });
                  
                  // Перехват кнопок и отправка их в ядро Rust
                  surface.setOnKeyListener((v, keyCode, event) -> {
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          int c = event.getUnicodeChar();
                          if (keyCode == KeyEvent.KEYCODE_DEL) c = 8; // Backspace
                          if (keyCode == KeyEvent.KEYCODE_ENTER) c = 10; // Enter
                          if (c != 0) kbBuffer.put(0, (byte)c);
                          return true;
                      }
                      return false;
                  });
                  
                  surface.getHolder().addCallback(new SurfaceHolder.Callback() {
                      @Override
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> {
                              try {
                                  byte[] kernel = getResources().openRawResource(R.raw.kernel_bin).readAllBytes();
                                  startKernel(kernel, frameBuffer, kbBuffer, WIDTH, HEIGHT);
                              } catch(Exception e) { e.printStackTrace(); }
                          }).start();
                          
                          new Thread(() -> {
                              while(true) {
                                  Canvas c = h.lockCanvas();
                                  if (c != null) {
                                      frameBuffer.position(0);
                                      bitmap.copyPixelsFromBuffer(frameBuffer);
                                      c.drawBitmap(bitmap, null, new Rect(0,0, surface.getWidth(), surface.getHeight()), null);
                                      h.unlockCanvasAndPost(c);
                                  }
                                  try { Thread.sleep(16); } catch(Exception e){}
                              }
                          }).start();
                      }
                      @Override public void surfaceChanged(SurfaceHolder h, int f, int w, int h2) {}
                      @Override public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }
          }
          EOF
          
          cat > app/src/main/cpp/loader.cpp << 'EOF'
          #include <jni.h>
          #include <sys/mman.h>
          #include <cstring>
          #include <android/log.h>
          
          extern "C" JNIEXPORT void JNICALL
          Java_com_aetheria_loader_MainActivity_startKernel(JNIEnv* env, jobject, jbyteArray kernelData, jobject fb, jobject kb, jint w, jint h) {
              jsize len = env->GetArrayLength(kernelData);
              jbyte* bytes = env->GetByteArrayElements(kernelData, nullptr);
              void* fb_ptr = env->GetDirectBufferAddress(fb);
              void* kb_ptr = env->GetDirectBufferAddress(kb);
              
              void* exec_mem = mmap(nullptr, len, PROT_READ | PROT_WRITE | PROT_EXEC, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
              memcpy(exec_mem, bytes, len);
              __builtin___clear_cache((char*)exec_mem, (char*)exec_mem + len);
              
              typedef void (*KernelMain)(void*, void*, uint32_t, uint32_t);
              KernelMain kmain = (KernelMain)exec_mem;
              kmain(fb_ptr, kb_ptr, w, h);
              
              env->ReleaseByteArrayElements(kernelData, bytes, JNI_ABORT);
          }
          EOF
          
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aetheria_loader)
          add_library(aetheria_loader SHARED loader.cpp)
          target_link_libraries(aetheria_loader log)
          target_compile_options(aetheria_loader PRIVATE -O3 -fPIC)
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="AetheriaOS" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name="com.aetheria.loader.MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.aetheria.loader'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.aetheria.loader'
                  minSdk 24
                  targetSdk 34
                  externalNativeBuild { cmake { cppFlags "-O3 -fPIC" } }
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
          }
          EOF
          
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          echo 'include ":app"' > settings.gradle

      # ===== 3. СБОРКА APK =====
      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --no-daemon

      # ===== 4. ПАКУЕМ ВСЁ В АРХИВ =====
      - name: Package Release
        run: |
          mkdir -p AetheriaOS_Release
          cp app/build/outputs/apk/debug/app-debug.apk AetheriaOS_Release/AetheriaOS-Virtual.apk
          cp aetheria_kernel/kernel.bin AetheriaOS_Release/kernel.bin
          
          cd AetheriaOS_Release
          zip -r ../AetheriaOS-Ultimate-Build.zip *
          
      - name: Upload OS Package
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-Ultimate
          path: AetheriaOS-Ultimate-Build.zip
          retention-days: 30
