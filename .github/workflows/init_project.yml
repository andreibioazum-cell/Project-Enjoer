name: JsAI_Craft_V12_MEGA_ULTIMATE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/jsai/craft
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/joy_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#12FFFFFF"/><stroke android:width="1.5dp" android:color="#20FFFFFF"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/joy_handle.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#50FFFFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/dot.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#FFFFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/btn_grass.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#7ED321"/></shape>
          EOF
          cat > app/src/main/res/drawable/btn_stone.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#999999"/></shape>
          EOF
          cat > app/src/main/res/drawable/btn_dirt.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#8B4513"/></shape>
          EOF

          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.jsai.craft'
              compileSdk 34
              defaultConfig { 
                  applicationId 'com.jsai.craft'
                  minSdk 24
                  targetSdk 34
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:clipChildren="false" android:clipToPadding="false">
              <android.opengl.GLSurfaceView android:id="@+id/glView"
                  android:layout_width="match_parent" android:layout_height="match_parent" />
              <View android:layout_width="4dp" android:layout_height="4dp" 
                  android:background="@drawable/dot" android:layout_centerInParent="true" />
              
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_alignParentTop="true" android:layout_centerHorizontal="true"
                  android:layout_marginTop="10dp" android:orientation="horizontal">
                  <Button android:id="@+id/btnGrass" android:layout_width="50dp" android:layout_height="50dp" 
                      android:background="@drawable/btn_grass" android:text="1" android:textColor="#FFF"/>
                  <Button android:id="@+id/btnStone" android:layout_width="50dp" android:layout_height="50dp" 
                      android:background="@drawable/btn_stone" android:text="2" android:textColor="#FFF" android:layout_marginLeft="5dp"/>
                  <Button android:id="@+id/btnDirt" android:layout_width="50dp" android:layout_height="50dp" 
                      android:background="@drawable/btn_dirt" android:text="3" android:textColor="#FFF" android:layout_marginLeft="5dp"/>
              </LinearLayout>

              <Button android:id="@+id/btnSettings" android:layout_width="50dp" android:layout_height="50dp"
                  android:layout_alignParentTop="true" android:layout_alignParentRight="true"
                  android:layout_margin="10dp" android:text="⚙" android:textSize="24sp"/>

              <ScrollView android:id="@+id/settingsPanel" android:layout_width="300dp" android:layout_height="wrap_content"
                  android:layout_alignParentTop="true" android:layout_alignParentRight="true"
                  android:layout_margin="70dp" android:background="#DD000000" android:padding="10dp" android:visibility="gone">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                      <TextView android:text="RENDER DISTANCE" android:textColor="#FFF" android:textStyle="bold"/>
                      <SeekBar android:id="@+id/seekRender" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:max="64" android:progress="24"/>
                      <TextView android:id="@+id/txtRender" android:text="24 chunks" android:textColor="#FFF"/>
                      
                      <TextView android:text="MEMORY (MB)" android:textColor="#FFF" android:textStyle="bold" android:layout_marginTop="10dp"/>
                      <SeekBar android:id="@+id/seekMemory" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:max="2048" android:progress="512"/>
                      <TextView android:id="@+id/txtMemory" android:text="512 MB" android:textColor="#FFF"/>
                      
                      <CheckBox android:id="@+id/chkFastLoad" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:text="Fast Chunk Loading" android:textColor="#FFF" android:checked="true"/>
                      
                      <CheckBox android:id="@+id/chkMobs" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:text="Enable Mobs" android:textColor="#FFF" android:checked="true"/>
                      
                      <CheckBox android:id="@+id/chkVillages" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:text="Generate Villages" android:textColor="#FFF" android:checked="true"/>
                  </LinearLayout>
              </ScrollView>

              <FrameLayout android:id="@+id/joyZone"
                  android:layout_width="90dp" android:layout_height="90dp"
                  android:layout_alignParentBottom="true" android:layout_margin="35dp"
                  android:background="@drawable/joy_bg" android:clipChildren="false">
                  <View android:id="@+id/joyHandle"
                      android:layout_width="34dp" android:layout_height="34dp"
                      android:layout_gravity="center" android:background="@drawable/joy_handle"/>
              </FrameLayout>
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true" android:layout_alignParentRight="true"
                  android:layout_margin="10dp" android:orientation="vertical">
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content">
                      <Button android:id="@+id/btnBreak" android:layout_width="65dp" android:layout_height="65dp" android:text="BRK" />
                      <Button android:id="@+id/btnPlace" android:layout_width="65dp" android:layout_height="65dp" android:text="PLC" android:layout_marginLeft="5dp" />
                  </LinearLayout>
                  <Button android:id="@+id/btnJump" android:layout_width="135dp" android:layout_height="70dp" android:text="JUMP" android:layout_marginTop="5dp" />
              </LinearLayout>

              <TextView android:id="@+id/txtFPS" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true" android:layout_centerHorizontal="true"
                  android:text="FPS: 60" android:textColor="#FFFFFF" android:textStyle="bold" android:background="#80000000" android:padding="5dp"/>
          </RelativeLayout>
          EOF

          cat > app/src/main/java/com/jsai/craft/MainActivity.java << 'EOF'
          package com.jsai.craft;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          public class MainActivity extends Activity {
              private GameView gv;
              private Button btnGrass, btnStone, btnDirt;
              private View settingsPanel;
              private TextView txtFPS, txtRender, txtMemory;
              private SeekBar seekRender, seekMemory;
              
              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  setContentView(R.layout.activity_main);
                  
                  gv = new GameView(this, findViewById(R.id.glView));
                  txtFPS = findViewById(R.id.txtFPS);
                  settingsPanel = findViewById(R.id.settingsPanel);
                  txtRender = findViewById(R.id.txtRender);
                  txtMemory = findViewById(R.id.txtMemory);
                  seekRender = findViewById(R.id.seekRender);
                  seekMemory = findViewById(R.id.seekMemory);
                  
                  findViewById(R.id.btnSettings).setOnClickListener(v -> 
                      settingsPanel.setVisibility(settingsPanel.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE));
                  
                  seekRender.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          gv.renderer.renderDistance = Math.max(8, p);
                          txtRender.setText(gv.renderer.renderDistance + " chunks");
                          gv.renderer.rebuildAllChunks();
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  
                  seekMemory.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          txtMemory.setText(Math.max(256, p) + " MB");
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  
                  ((CheckBox)findViewById(R.id.chkFastLoad)).setOnCheckedChangeListener((b,c) -> gv.renderer.fastLoad = c);
                  ((CheckBox)findViewById(R.id.chkMobs)).setOnCheckedChangeListener((b,c) -> gv.renderer.mobsEnabled = c);
                  ((CheckBox)findViewById(R.id.chkVillages)).setOnCheckedChangeListener((b,c) -> gv.renderer.villagesEnabled = c);
                  
                  findViewById(R.id.btnJump).setOnClickListener(v -> gv.renderer.jump());
                  findViewById(R.id.btnBreak).setOnTouchListener((v, e) -> {
                      if(e.getAction() == MotionEvent.ACTION_DOWN) gv.renderer.startBreak();
                      else if(e.getAction() == MotionEvent.ACTION_UP) gv.renderer.stopBreak();
                      return true;
                  });
                  findViewById(R.id.btnPlace).setOnClickListener(v -> gv.renderer.place());
                  
                  btnGrass = findViewById(R.id.btnGrass);
                  btnStone = findViewById(R.id.btnStone);
                  btnDirt = findViewById(R.id.btnDirt);
                  
                  btnGrass.setOnClickListener(v -> selectBlock(1));
                  btnStone.setOnClickListener(v -> selectBlock(2));
                  btnDirt.setOnClickListener(v -> selectBlock(3));
                  
                  selectBlock(1);
                  
                  View jZ = findViewById(R.id.joyZone), jH = findViewById(R.id.joyHandle);
                  jZ.setOnTouchListener((v, e) -> {
                      if(e.getAction() == MotionEvent.ACTION_UP) {
                          jH.setTranslationX(0); jH.setTranslationY(0); gv.renderer.setMove(0, 0);
                      } else {
                          float r = v.getWidth()/2f, dx = e.getX()-r, dy = e.getY()-r, d = (float)Math.sqrt(dx*dx+dy*dy);
                          if(d>r) { dx=dx/d*r; dy=dy/d*r; }
                          jH.setTranslationX(dx); jH.setTranslationY(dy);
                          gv.renderer.setMove(dx/r, -dy/r);
                      }
                      return true;
                  });
                  
                  new Thread(() -> {
                      long lastTime = System.nanoTime();
                      int frames = 0;
                      while(true) {
                          try { Thread.sleep(16); } catch(Exception e) {}
                          frames++;
                          long now = System.nanoTime();
                          if(now - lastTime >= 1000000000L) {
                              final int fps = frames;
                              runOnUiThread(() -> txtFPS.setText("FPS: " + fps));
                              frames = 0;
                              lastTime = now;
                          }
                      }
                  }).start();
              }
              
              private void selectBlock(int type) {
                  gv.renderer.selectedBlock = (byte)type;
                  btnGrass.setAlpha(type==1?1f:0.5f);
                  btnStone.setAlpha(type==2?1f:0.5f);
                  btnDirt.setAlpha(type==3?1f:0.5f);
              }
          }
          EOF

          cat > app/src/main/java/com/jsai/craft/GameView.java << 'EOF'
          package com.jsai.craft;
          import android.content.Context;
          import android.opengl.GLSurfaceView;
          import android.view.MotionEvent;
          public class GameView {
              public CraftRenderer renderer;
              private float lx, ly;
              private boolean isPanning = false;

              public GameView(Context ctx, GLSurfaceView gl) {
                  gl.setEGLContextClientVersion(3);
                  gl.setEGLConfigChooser(8, 8, 8, 8, 24, 8);
                  renderer = new CraftRenderer();
                  gl.setRenderer(renderer);
                  gl.setRenderMode(GLSurfaceView.RENDERMODE_CONTINUOUSLY);
                  gl.setOnTouchListener((v, e) -> {
                      float x = e.getX(), y = e.getY();
                      switch(e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              if(x > v.getWidth()/2f) { isPanning = true; lx = x; ly = y; }
                              break;
                          case MotionEvent.ACTION_MOVE:
                              if(isPanning) {
                                  renderer.yaw -= (x - lx) * 0.25f;
                                  renderer.pitch += (y - ly) * 0.25f;
                                  if(renderer.pitch > 89) renderer.pitch = 89;
                                  if(renderer.pitch < -89) renderer.pitch = -89;
                                  lx = x; ly = y;
                              }
                              break;
                          case MotionEvent.ACTION_UP:
                              isPanning = false;
                              break;
                      }
                      return true;
                  });
              }
          }
          EOF

          cat > app/src/main/java/com/jsai/craft/CraftRenderer.java << 'EOF'
          package com.jsai.craft;
          import android.opengl.GLES30;
          import android.opengl.GLSurfaceView;
          import android.opengl.Matrix;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;
          import java.util.*;

          public class CraftRenderer implements GLSurfaceView.Renderer {
              public float yaw = 0, pitch = 0;
              private float px = 64, py = 25, pz = 64, vy = 0, mvX = 0, mvZ = 0;
              private final float[] proj = new float[16], view = new float[16], mvp = new float[16];
              private Block block;
              private byte[] world = new byte[128 * 64 * 128];
              private int[] sel = null, plc = null;
              public byte selectedBlock = 1;
              public boolean isBreaking = false;
              public float breakProgress = 0, placeProgress = 0;
              private long breakStart = 0;
              private static final long BREAK_TIME = 1500;
              public int renderDistance = 24;
              public boolean fastLoad = true, mobsEnabled = true, villagesEnabled = true;
              
              private List<Mob> mobs = new ArrayList<>();
              private List<Villager> villagers = new ArrayList<>();
              private Random rand = new Random();

              public void onSurfaceCreated(GL10 g, EGLConfig c) {
                  GLES30.glClearColor(0.53f, 0.81f, 0.92f, 1.0f);
                  GLES30.glEnable(GLES30.GL_DEPTH_TEST);
                  GLES30.glEnable(GLES30.GL_CULL_FACE);
                  GLES30.glEnable(GLES30.GL_BLEND);
                  GLES30.glBlendFunc(GLES30.GL_SRC_ALPHA, GLES30.GL_ONE_MINUS_SRC_ALPHA);
                  block = new Block();
                  
                  for(int x=0; x<128; x++) for(int z=0; z<128; z++) {
                      int h = (int)(Math.sin(x*0.12)*Math.cos(z*0.12)*4 + 10);
                      for(int y=0; y<h; y++) setB(x,y,z,(byte)(y==h-1?1:y<h-3?2:3));
                      
                      if(rand.nextInt(100) < 3) {
                          for(int ty=h; ty<h+5; ty++) setB(x,ty,z,(byte)4);
                          for(int lx=-2; lx<=2; lx++) for(int lz=-2; lz<=2; lz++) 
                              if(Math.abs(lx)+Math.abs(lz)<4) setB(x+lx,h+5,z+lz,(byte)5);
                      }
                  }
                  
                  if(villagesEnabled) {
                      for(int i=0; i<3; i++) {
                          int vx = 20 + rand.nextInt(80), vz = 20 + rand.nextInt(80);
                          generateVillage(vx, vz);
                      }
                  }
                  
                  if(mobsEnabled) {
                      for(int i=0; i<15; i++) {
                          mobs.add(new Mob(rand.nextInt(128), 20, rand.nextInt(128)));
                      }
                  }
              }
              
              private void generateVillage(int cx, int cz) {
                  for(int hx=-3; hx<=3; hx++) for(int hz=-3; hz<=3; hz++) {
                      if(Math.abs(hx)+Math.abs(hz) > 5) continue;
                      int h = getHeight(cx+hx, cz+hz);
                      for(int y=h; y<h+4; y++) setB(cx+hx, y, cz+hz, (byte)6);
                      villagers.add(new Villager(cx+hx, h+4, cz+hz));
                  }
              }
              
              private int getHeight(int x, int z) {
                  for(int y=63; y>=0; y--) if(getB(x,y,z)>0) return y+1;
                  return 10;
              }
              
              private void setB(int x, int y, int z, byte t) { 
                  if(x>=0&&x<128&&y>=0&&y<64&&z>=0&&z<128) world[x+y*128+z*128*64]=t;
              }
              
              private byte getB(int x, int y, int z) { 
                  if(x>=0&&x<128&&y>=0&&y<64&&z>=0&&z<128) return world[x+y*128+z*128*64]; 
                  return 0; 
              }

              public void setMove(float x, float z) { mvX = x; mvZ = z; }
              public void jump() { if(Math.abs(vy) < 0.02f) vy = 0.218f; }

              public void startBreak() { 
                  if(sel != null) { 
                      isBreaking = true; 
                      breakStart = System.currentTimeMillis(); 
                  } 
              }
              
              public void stopBreak() { 
                  isBreaking = false; 
                  breakProgress = 0; 
              }
              
              public void place() {
                  if(plc != null && sel != null) {
                      int px = plc[0], py = plc[1], pz = plc[2];
                      if(getB(px,py,pz) == 0 && 
                         !(Math.abs(this.px-px)<0.815f && Math.abs(this.py-py)<1.83f && Math.abs(this.pz-pz)<0.815f)) {
                          setB(px, py, pz, selectedBlock);
                          placeProgress = 0;
                      }
                  }
              }
              
              public void rebuildAllChunks() {}

              public void onDrawFrame(GL10 g) {
                  update();
                  GLES30.glClear(GLES30.GL_COLOR_BUFFER_BIT | GLES30.GL_DEPTH_BUFFER_BIT);
                  
                  float lx=(float)(Math.cos(Math.toRadians(pitch))*Math.sin(Math.toRadians(yaw))), 
                        ly=(float)(-Math.sin(Math.toRadians(pitch))), 
                        lz=(float)(Math.cos(Math.toRadians(pitch))*Math.cos(Math.toRadians(yaw)));
                  
                  Matrix.setLookAtM(view, 0, px, py+1.6f, pz, px+lx, py+1.6f+ly, pz+lz, 0, 1, 0);
                  Matrix.multiplyMM(mvp, 0, proj, 0, view, 0);

                  sel=null; plc=null;
                  for(float d=0; d<6; d+=0.1f) {
                      int tx=(int)Math.floor(px+lx*d), ty=(int)Math.floor(py+1.6f+ly*d), tz=(int)Math.floor(pz+lz*d);
                      if(getB(tx,ty,tz)>0) {
                          sel=new int[]{tx,ty,tz};
                          float ox=px+lx*(d-0.1f), oy=py+1.6f+ly*(d-0.1f), oz=pz+lz*(d-0.1f);
                          plc=new int[]{(int)Math.floor(ox), (int)Math.floor(oy), (int)Math.floor(oz)};
                          break;
                      }
                  }
                  
                  if(isBreaking && sel != null) {
                      long elapsed = System.currentTimeMillis() - breakStart;
                      breakProgress = Math.min(1.0f, elapsed / (float)BREAK_TIME);
                      if(breakProgress >= 1.0f) {
                          setB(sel[0], sel[1], sel[2], (byte)0);
                          isBreaking = false;
                          breakProgress = 0;
                      }
                  }
                  
                  if(placeProgress < 1.0f) placeProgress = Math.min(1.0f, placeProgress + 0.08f);

                  int r = renderDistance;
                  for(int x=(int)px-r; x<(int)px+r; x++) {
                      for(int z=(int)pz-r; z<(int)pz+r; z++) {
                          for(int y=0; y<64; y++) {
                              byte t = getB(x,y,z);
                              if(t>0) {
                                  float dx = x - px, dy = y - py, dz = z - pz;
                                  float dist = dx*dx + dy*dy + dz*dz;
                                  if(dist > r*r) continue;
                                  
                                  if(getB(x+1,y,z)>0 && getB(x-1,y,z)>0 && 
                                     getB(x,y+1,z)>0 && getB(x,y-1,z)>0 && 
                                     getB(x,y,z+1)>0 && getB(x,y,z-1)>0) continue;
                                  
                                  float[] m=new float[16], res=new float[16]; 
                                  Matrix.setIdentityM(m,0); 
                                  
                                  boolean isSelected = (sel!=null && x==sel[0] && y==sel[1] && z==sel[2]);
                                  boolean isPlaced = (plc!=null && x==plc[0] && y==plc[1] && z==plc[2] && placeProgress<1.0f);
                                  
                                  float scale = 1.0f;
                                  float alpha = 1.0f;
                                  
                                  if(isSelected && isBreaking) {
                                      scale = 1.0f - breakProgress * 0.3f;
                                      alpha = 1.0f - breakProgress * 0.7f;
                                  } else if(isPlaced) {
                                      scale = placeProgress;
                                      alpha = placeProgress;
                                  }
                                  
                                  Matrix.translateM(m,0,x+0.5f,y+0.5f,z+0.5f); 
                                  Matrix.scaleM(m,0,scale,scale,scale);
                                  Matrix.translateM(m,0,-0.5f,-0.5f,-0.5f);
                                  Matrix.multiplyMM(res,0,mvp,0,m,0);
                                  block.draw(res, isSelected, t, alpha);
                              }
                          }
                      }
                  }
                  
                  for(Mob mob : mobs) {
                      mob.update();
                      float[] m=new float[16], res=new float[16];
                      Matrix.setIdentityM(m,0); 
                      Matrix.translateM(m,0,mob.x,mob.y,mob.z); 
                      Matrix.scaleM(m,0,0.5f,1.0f,0.5f);
                      Matrix.multiplyMM(res,0,mvp,0,m,0);
                      block.draw(res, false, (byte)7, 1.0f);
                  }
                  
                  for(Villager vil : villagers) {
                      vil.update();
                      float[] m=new float[16], res=new float[16];
                      Matrix.setIdentityM(m,0); 
                      Matrix.translateM(m,0,vil.x,vil.y,vil.z); 
                      Matrix.scaleM(m,0,0.6f,1.8f,0.6f);
                      Matrix.multiplyMM(res,0,mvp,0,m,0);
                      block.draw(res, false, (byte)8, 1.0f);
                  }
              }

              private void update() {
                  float s=(float)Math.sin(Math.toRadians(yaw)), c=(float)Math.cos(Math.toRadians(yaw));
                  float dx = (mvZ * s - mvX * c) * 0.1079f;
                  float dz = (mvZ * c + mvX * s) * 0.1079f;
                  
                  if(getB((int)Math.floor(px+dx+(dx>0?0.5f:-0.5f)), (int)py, (int)pz)==0 && 
                     getB((int)Math.floor(px+dx+(dx>0?0.5f:-0.5f)), (int)py+1, (int)pz)==0) px+=dx;
                  if(getB((int)px, (int)py, (int)Math.floor(pz+dz+(dz>0?0.5f:-0.5f)))==0 &&
                     getB((int)px, (int)py+1, (int)Math.floor(pz+dz+(dz>0?0.5f:-0.5f)))==0) pz+=dz;

                  vy-=0.01148f; 
                  py+=vy;
                  if(getB((int)px, (int)Math.floor(py), (int)pz)>0) { py=(int)Math.floor(py)+1; vy=0; }
                  if(py < -10) { px=64; py=30; pz=64; vy=0; }
              }
              
              public void onSurfaceChanged(GL10 g, int w, int h) { 
                  GLES30.glViewport(0,0,w,h); 
                  Matrix.perspectiveM(proj, 0, 70, (float)w/h, 0.1f, 200f); 
              }
              
              class Mob {
                  float x, y, z, vx, vz;
                  Mob(float x, float y, float z) { this.x=x; this.y=y; this.z=z; vx=rand.nextFloat()-0.5f; vz=rand.nextFloat()-0.5f; }
                  void update() { 
                      x+=vx*0.05f; z+=vz*0.05f; 
                      if(rand.nextInt(100)<2) { vx=rand.nextFloat()-0.5f; vz=rand.nextFloat()-0.5f; }
                  }
              }
              
              class Villager {
                  float x, y, z;
                  Villager(float x, float y, float z) { this.x=x; this.y=y; this.z=z; }
                  void update() {}
              }
          }
          EOF

