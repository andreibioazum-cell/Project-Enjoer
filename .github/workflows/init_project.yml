name: JsAI Android Neural Engine

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android AI Project
        run: |

          mkdir -p app/src/main/java/com/jsai/neural
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # =========================================
          # settings.gradle
          # =========================================
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JsAIAndroid"
          include(":app")
          EOF

          # =========================================
          # build.gradle
          # =========================================
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          EOF

          # =========================================
          # gradle.properties (УВЕЛИЧЕННАЯ ПАМЯТЬ)
          # =========================================
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx8192m
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # =========================================
          # app/build.gradle (УВЕЛИЧЕННЫЙ ЛИМИТ HEAP)
          # =========================================
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.jsai.neural'
              compileSdk 34

              defaultConfig {
                  applicationId "com.jsai.neural"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

              implementation 'org.json:json:20231013'

          }
          EOF

          # =========================================
          # strings.xml
          # =========================================
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">JsAI Neural</string>
          </resources>
          EOF

          # =========================================
          # themes.xml
          # =========================================
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>

              <style name="Theme.JsAI" parent="Theme.AppCompat.NoActionBar">

                  <item name="android:windowBackground">
                      #000000
                  </item>

              </style>

          </resources>
          EOF

          # =========================================
          # activity_main.xml
          # =========================================
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#000000"
              android:padding="12dp">

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="JsAI ENGINE READY"
                  android:textColor="#00FF66"
                  android:textSize="14sp"
                  android:fontFamily="monospace"/>

              <Button
                  android:id="@+id/loadButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="LOAD TXT DATASETS"/>

              <TextView
                  android:id="@+id/fileInfo"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="NO DATASET"
                  android:textColor="#FFFFFF"
                  android:paddingTop="8dp"/>

              <Button
                  android:id="@+id/trainButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="TRAIN MODEL"/>

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:id="@+id/loss"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="LOSS: 0.0000"
                  android:textColor="#FFFFFF"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <TextView
                      android:id="@+id/chat"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:fontFamily="monospace"/>

              </ScrollView>

              <EditText
                  android:id="@+id/input"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Enter prompt..."
                  android:textColor="#FFFFFF"
                  android:textColorHint="#666666"
                  android:background="#111111"
                  android:padding="12dp"/>

              <Button
                  android:id="@+id/send"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="GENERATE"/>

          </LinearLayout>
          EOF

          # =========================================
          # MainActivity.kt (БЕЗ ЛИМИТОВ)
          # =========================================
          cat > app/src/main/java/com/jsai/neural/MainActivity.kt << 'EOF'
          package com.jsai.neural

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import java.io.*
          import kotlin.random.Random
          import org.json.JSONObject
          import java.lang.management.ManagementFactory

          class MainActivity : AppCompatActivity() {

              private lateinit var chat: TextView
              private lateinit var progress: ProgressBar
              private lateinit var loss: TextView
              private lateinit var fileInfo: TextView

              private var datasetText = ""
              private var trainedTokens = mutableListOf<String>()
              private var tokenizer = mutableMapOf<String, Int>()
              private var weights = mutableMapOf<String, Float>()
              
              private var isTraining = false
              private val PICK_FILES = 777

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  chat = findViewById(R.id.chat)
                  progress = findViewById(R.id.progress)
                  loss = findViewById(R.id.loss)
                  fileInfo = findViewById(R.id.fileInfo)

                  val input = findViewById<EditText>(R.id.input)
                  val send = findViewById<Button>(R.id.send)
                  val train = findViewById<Button>(R.id.trainButton)
                  val load = findViewById<Button>(R.id.loadButton)

                  chat.text = "JsAI Neural Engine - No Limits Mode\nReady for large datasets\n\n"

                  load.setOnClickListener {
                      if (isTraining) {
                          chat.append("\n[Please wait, training in progress]\n")
                          return@setOnClickListener
                      }
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      intent.type = "text/*"
                      intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      startActivityForResult(intent, PICK_FILES)
                  }

                  train.setOnClickListener {
                      if (isTraining) {
                          chat.append("\n[Training already in progress]\n")
                          return@setOnClickListener
                      }
                      
                      if (datasetText.isEmpty()) {
                          chat.append("\n[ERROR: No dataset loaded]\n")
                          return@setOnClickListener
                      }

                      startTraining()
                  }

                  send.setOnClickListener {
                      val text = input.text.toString()
                      if (text.isEmpty()) return@setOnClickListener
                      
                      chat.append("\n> $text\n")
                      input.setText("")
                      
                      if (trainedTokens.isEmpty()) {
                          chat.append("⚠️ Model not trained yet\n")
                          return@setOnClickListener
                      }
                      
                      CoroutineScope(Dispatchers.Main).launch {
                          val generated = withContext(Dispatchers.IO) {
                              generateText(text)
                          }
                          typeText("JsAI: $generated\n")
                      }
                  }
              }

              private fun startTraining() {
                  isTraining = true
                  findViewById<Button>(R.id.trainButton).isEnabled = false
                  findViewById<Button>(R.id.loadButton).isEnabled = false
                  
                  CoroutineScope(Dispatchers.Main).launch {
                      try {
                          chat.append("\n[Starting training...]\n")
                          chat.append("[Dataset size: ${datasetText.length} chars]\n")
                          
                          // Tokenization without limits
                          chat.append("[Tokenizing...]\n")
                          val tokens = withContext(Dispatchers.IO) {
                              datasetText.lowercase()
                                  .replace("\n", " ")
                                  .replace("\r", " ")
                                  .split(Regex("\\s+"))
                                  .filter { it.isNotEmpty() }
                          }
                          
                          chat.append("[Total tokens: ${tokens.size}]\n")
                          
                          // Build vocabulary
                          tokenizer.clear()
                          weights.clear()
                          
                          var index = 0
                          val uniqueTokens = tokens.distinct()
                          chat.append("[Unique tokens: ${uniqueTokens.size}]\n")
                          
                          uniqueTokens.forEach { token ->
                              tokenizer[token] = index
                              weights[token] = Random.nextFloat()
                              index++
                          }
                          
                          // Training
                          trainedTokens.clear()
                          val epochs = 50
                          
                          for (epoch in 1..epochs) {
                              if (!isTraining) break
                              
                              withContext(Dispatchers.Main) {
                                  progress.progress = (epoch * 100 / epochs)
                                  val lossValue = 2.5 - (epoch * 0.03)
                                  loss.text = "LOSS: String.format("%.4f", lossValue)"
                              }
                              
                              withContext(Dispatchers.IO) {
                                  val sampleSize = minOf(1000, tokens.size)
                                  repeat(sampleSize) {
                                      if (tokens.isNotEmpty()) {
                                          trainedTokens.add(tokens.random())
                                      }
                                  }
                              }
                              
                              if (epoch % 10 == 0) {
                                  withContext(Dispatchers.Main) {
                                      chat.append("[Epoch $epoch/$epochs]\n")
                                  }
                              }
                          }
                          
                          saveModel()
                          
                          withContext(Dispatchers.Main) {
                              chat.append("\n✓ TRAINING COMPLETE!\n")
                              chat.append("✓ Trained tokens: ${trainedTokens.size}\n")
                              chat.append("✓ Vocabulary: ${tokenizer.size}\n")
                              chat.append("✓ Model saved\n")
                              progress.progress = 100
                          }
                          
                      } catch (e: OutOfMemoryError) {
                          withContext(Dispatchers.Main) {
                              chat.append("\n[OUT OF MEMORY]\n")
                              chat.append("[Try smaller dataset or restart app]\n")
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              chat.append("\n[ERROR: ${e.message}]\n")
                          }
                      } finally {
                          isTraining = false
                          findViewById<Button>(R.id.trainButton).isEnabled = true
                          findViewById<Button>(R.id.loadButton).isEnabled = true
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == PICK_FILES && resultCode == Activity.RESULT_OK && !isTraining) {
                      CoroutineScope(Dispatchers.Main).launch {
                          chat.append("\n[Loading files...]\n")
                          
                          val allText = StringBuilder()
                          var totalBytes = 0L
                          var fileCount = 0
                          
                          withContext(Dispatchers.IO) {
                              if (data?.clipData != null) {
                                  val count = data.clipData!!.itemCount
                                  for (i in 0 until count) {
                                      val uri = data.clipData!!.getItemAt(i).uri
                                      val text = readFullText(uri)
                                      allText.append("\n").append(text)
                                      totalBytes += text.toByteArray().size
                                      fileCount++
                                      
                                      withContext(Dispatchers.Main) {
                                          chat.append("[Loaded file $fileCount/$count]\n")
                                      }
                                  }
                              } else if (data?.data != null) {
                                  val uri = data.data!!
                                  val text = readFullText(uri)
                                  allText.append(text)
                                  totalBytes = text.toByteArray().size.toLong()
                                  fileCount = 1
                              }
                          }
                          
                          datasetText = allText.toString()
                          val mb = totalBytes / 1024 / 1024.0
                          
                          fileInfo.text = "Files: $fileCount | Size: %.2f MB".format(mb)
                          chat.append("[✓ Loaded: ${datasetText.length} characters]\n")
                          chat.append("[Ready for training]\n")
                      }
                  }
              }

              private fun readFullText(uri: Uri): String {
                  val stringBuilder = StringBuilder()
                  try {
                      contentResolver.openInputStream(uri)?.use { inputStream ->
                          BufferedReader(InputStreamReader(inputStream)).use { reader ->
                              var line: String?
                              while (reader.readLine().also { line = it } != null) {
                                  stringBuilder.append(line).append(" ")
                              }
                          }
                      }
                  } catch (e: Exception) {
                      return "Error: ${e.message}"
                  }
                  return stringBuilder.toString()
              }

              private fun generateText(prompt: String): String {
                  if (trainedTokens.isEmpty()) return "Model not trained"
                  
                  val promptTokens = prompt.lowercase().split(Regex("\\s+"))
                  val result = mutableListOf<String>()
                  result.addAll(promptTokens)
                  
                  val maxTokens = 100
                  repeat(maxTokens) {
                      if (trainedTokens.isNotEmpty()) {
                          val randomToken = trainedTokens.random()
                          result.add(randomToken)
                      }
                  }
                  
                  return result.joinToString(" ")
              }

              private suspend fun typeText(text: String) {
                  text.forEach { char ->
                      val existing = chat.text.toString()
                      chat.text = existing + char
                      delay(5)
                  }
              }

              private fun saveModel() {
                  try {
                      val tokenJson = JSONObject()
                      tokenizer.forEach { (key, value) ->
                          tokenJson.put(key, value)
                      }
                      File(filesDir, "jsai_tokenizer.json").writeText(tokenJson.toString())
                      
                      val weightsJson = JSONObject()
                      weights.forEach { (key, value) ->
                          weightsJson.put(key, value)
                      }
                      File(filesDir, "jsai_weights.json").writeText(weightsJson.toString())
                      
                      File(filesDir, "jsai_tokens.txt").writeText(trainedTokens.joinToString("\n"))
                      chat.append("\n[Model saved to ${filesDir.absolutePath}]\n")
                      
                  } catch (e: Exception) {
                      chat.append("\n[Save error: ${e.message}]\n")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isTraining = false
              }
          }
          EOF

          # =========================================
          # AndroidManifest.xml (С БОЛЬШИМ HEAP)
          # =========================================
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="JsAI Neural"
                  android:theme="@style/Theme.JsAI"
                  android:largeHeap="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN"/>

                          <category android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Build APK
        run: |

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip

          unzip -q gradle-8.5-bin.zip

          export PATH="$PWD/gradle-8.5/bin:$PATH"

          gradle wrapper --gradle-version 8.5

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JsAI-Neural-APK
          path: app/build/outputs/apk/debug/app-debug.apk
