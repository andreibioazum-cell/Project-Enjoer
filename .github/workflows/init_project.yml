name: MadGPT Ultra-Fast Mobile Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/madgpt/ultra
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 1. Android Manifest (Настройки разрешений)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <application 
                  android:label="MadGPT Ultra" 
                  android:theme="@style/Theme.Material3.Dark"
                  android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. Build.gradle (Самые быстрые зависимости)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.madgpt.ultra'
              compileSdk 34
              defaultConfig {
                  applicationId "com.madgpt.ultra"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-Ultra"
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              // Движок ONNX Runtime для Android
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
          }
          EOF

          # 3. UI Layout (Интерфейс как в Streamlit, но нативный)
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#0E0E0E" android:padding="16dp">
              
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="MadGPT Ultra V7" android:textColor="#00FF41" android:textSize="24sp"
                  android:fontFamily="monospace" android:gravity="center" android:paddingBottom="10dp"/>

              <ScrollView android:id="@+id/scroll" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <TextView android:id="@+id/chatLog" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:textColor="#FFFFFF" android:fontFamily="monospace" android:textSize="14sp"/>
              </ScrollView>

              <ProgressBar android:id="@+id/loader" android:layout_width="match_parent" android:layout_height="4dp"
                  style="@android:style/Widget.ProgressBar.Horizontal" android:visibility="gone" android:progressTint="#00FF41"/>

              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <Button android:id="@+id/btnFile" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="📎" android:backgroundTint="#222222"/>
                  <EditText android:id="@+id/userInput" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:hint="Злой запрос..." android:textColor="#FFFFFF" android:textColorHint="#555555"/>
                  <Button android:id="@+id/btnSend" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="▶" android:backgroundTint="#00FF41"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 4. MainActivity.kt (Логика инференса и оптимизация ОЗУ)
          cat > app/src/main/java/com/madgpt/ultra/MainActivity.kt << 'EOF'
          package com.madgpt.ultra

          import android.os.Bundle
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import ai.onnxruntime.*
          import kotlinx.coroutines.*
          import java.util.*

          class MainActivity : AppCompatActivity() {
              private lateinit var ortEnv: OrtEnvironment
              private lateinit var ortSession: OrtSession
              private lateinit var chatLog: TextView
              private lateinit var userInput: EditText
              private lateinit var loader: ProgressBar

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  chatLog = findViewById(R.id.chatLog)
                  userInput = findViewById(R.id.userInput)
                  loader = findViewById(R.id.loader)

                  initEngine()

                  findViewById<Button>(R.id.btnSend).setOnClickListener {
                      val text = userInput.text.toString()
                      if (text.isNotEmpty()) processChat(text)
                  }
              }

              private fun initEngine() {
                  ortEnv = OrtEnvironment.getEnvironment()
                  // Оптимизация: использование всех ядер процессора и NNAPI
                  val options = OrtSession.SessionOptions().apply {
                      addConfigEntry("session.load_model_format", "ORT")
                      setInterOpNumThreads(Runtime.getRuntime().availableProcessors())
                      setIntraOpNumThreads(Runtime.getRuntime().availableProcessors())
                  }
                  
                  try {
                      val modelBytes = assets.open("model.onnx").readBytes()
                      ortSession = ortEnv.createSession(modelBytes, options)
                  } catch (e: Exception) {
                      chatLog.text = "Ошибка: Положите model.onnx в assets!"
                  }
              }

              private fun processChat(text: String) {
                  chatLog.append("\nЯ: $text\n")
                  userInput.setText("")
                  loader.visibility = View.VISIBLE

                  CoroutineScope(Dispatchers.Default).launch {
                      // Тут вызывается токенизатор и прогон через ONNX
                      // Для краткости примера — имитация ответа
                      delay(500)
                      withContext(Dispatchers.Main) {
                          loader.visibility = View.GONE
                          chatLog.append("Бот: Я всё еще злой, но теперь на Kotlin!\n")
                      }
                  }
              }
          }
          EOF
          
          # Настройка Gradle Wrapper
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadGPT-Ultra-Final
          path: app/build/outputs/apk/debug/app-debug.apk
