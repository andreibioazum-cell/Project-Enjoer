name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install LLD Linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Generate Project
        run: |
          mkdir enjoer_game && cd enjoer_game
          keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=E,O=E,C=US"
          
          cat << 'EOF' > Cargo.toml
          [package]
          name = "enjoer_game"
          version = "7.4.0"
          edition = "2021"

          [lib]
          name = "enjoer_game"
          crate-type = ["cdylib"]

          [dependencies]
          bevy = { version = "0.14.0", default-features = false, features = [
              "bevy_pbr", 
              "bevy_render", 
              "bevy_winit", 
              "bevy_core_pipeline",
              "bevy_asset", 
              "bevy_state", 
              "bevy_color", 
              "multi_threaded", 
              "android_shared_stdcxx", 
              "tonemapping_luts"
          ] }
          bevy_egui = "0.28.0"

          [package.metadata.android]
          apk_name = "EnjoerSlim"
          build_targets = ["aarch64-linux-android"]
          min_sdk_version = 24
          target_sdk_version = 33
          strip = "strip"
          fullscreen = true

          [package.metadata.android.signing.release]
          path = "release.keystore"
          keystore_password = "password"
          key_alias = "mykey"
          key_password = "password"

          [profile.release]
          opt-level = "z"      # Оптимизация по размеру (APK будет меньше)
          lto = "thin" 
          codegen-units = 1
          panic = "abort"
          strip = true
          EOF
          
          mkdir src
          cat << 'EOF' > src/lib.rs
          use bevy::prelude::*;
          use bevy::window::{PrimaryWindow, WindowMode};
          use bevy::pbr::DirectionalLightShadowMap;
          use bevy_egui::{egui, EguiContexts, EguiPlugin};

          #[derive(States, Debug, Clone, Copy, Eq, PartialEq, Hash, Default)]
          enum GameState { #[default] Menu, Play }

          #[derive(Component)] struct Player { walk: f32 }
          #[derive(Component)] struct Pivot;
          #[derive(Component)] struct Model;
          #[derive(Component)] enum Limb { Arm { left: bool }, Leg { left: bool } }

          #[derive(Resource, Default)]
          struct Controls { move_dir: Vec2, look: Vec2, joy_c: Option<Vec2>, joy_cur: Option<Vec2> }

          #[bevy_main]
          fn main() {
              App::new()
                  .insert_resource(ClearColor(Color::BLACK))
                  // 256 - самая быстрая степень двойки для теней
                  .insert_resource(DirectionalLightShadowMap { size: 256 })
                  .add_plugins(DefaultPlugins.set(WindowPlugin {
                      primary_window: Some(Window { 
                          mode: WindowMode::BorderlessFullscreen, 
                          present_mode: bevy::window::PresentMode::Mailbox,
                          ..default() 
                      }), ..default()
                  })
                  .disable::<bevy::audio::AudioPlugin>() 
                  .disable::<bevy::ui::UiPlugin>() // ОТКЛЮЧАЕМ НЕИСПОЛЬЗУЕМЫЙ UI ДВИЖОК
                  )
                  .insert_resource(Msaa::Off)
                  .add_plugins(EguiPlugin)
                  .init_state::<GameState>()
                  .init_resource::<Controls>()
                  .add_systems(Startup, setup)
                  .add_systems(Update, style)
                  .add_systems(Update, menu.run_if(in_state(GameState::Menu)))
                  .add_systems(Update, (touch, hud, move_player, animate).run_if(in_state(GameState::Play)))
                  .run();
          }

          fn setup(mut cmd: Commands, mut mesh: ResMut<Assets<Mesh>>, mut mat: ResMut<Assets<StandardMaterial>>) {
              // Темные тени (низкий Ambient)
              cmd.insert_resource(AmbientLight { color: Color::WHITE, brightness: 250.0 });
              
              cmd.spawn(DirectionalLightBundle { 
                  directional_light: DirectionalLight { 
                      illuminance: 7000., 
                      shadows_enabled: true, 
                      shadow_depth_bias: 0.5,
                      shadow_normal_bias: 1.2,
                      ..default() 
                  }, 
                  transform: Transform::from_xyz(10., 20., 10.).looking_at(Vec3::ZERO, Vec3::Y), 
                  ..default() 
              });

              cmd.spawn(PbrBundle { 
                  mesh: mesh.add(Plane3d::default().mesh().size(100., 100.)), 
                  material: mat.add(StandardMaterial { base_color: Color::srgb(0.03, 0.03, 0.03), ..default() }), 
                  ..default() 
              });

              // Slim Character (Размеры точно как в HTML, голова -10%)
              let (t_w, t_h, t_d) = (0.95, 1.2, 0.6);
              let h_s = 0.72 * 0.9; 
              let (l_w, l_h, l_d) = (0.42, 1.1, 0.42);

              let skin = mat.add(StandardMaterial { base_color: Color::srgb(1.0, 0.86, 0.67), ..default() });
              let torso_m = mat.add(StandardMaterial { base_color: Color::srgb(0.13, 0.13, 0.13), ..default() });
              let leg_m = mat.add(StandardMaterial { base_color: Color::srgb(0.1, 0.1, 0.1), ..default() });

              cmd.spawn((SpatialBundle::from_transform(Transform::from_xyz(0., l_h + t_h/2.0, 0.)), Player { walk: 0. }))
              .with_children(|p| {
                  p.spawn((SpatialBundle::default(), Pivot)).with_children(|piv| {
                      piv.spawn(Camera3dBundle { transform: Transform::from_xyz(0., 3.5, 9.0).looking_at(Vec3::Y * 1.5, Vec3::Y), ..default() });
                  });

                  p.spawn((SpatialBundle::default(), Model)).with_children(|m| {
                      m.spawn(PbrBundle { mesh: mesh.add(Cuboid::new(t_w, t_h, t_d)), material: torso_m, ..default() });
                      m.spawn(PbrBundle { 
                          mesh: mesh.add(Cuboid::new(h_s, h_s, h_s)), 
                          material: skin.clone(), 
                          transform: Transform::from_xyz(0., (t_h/2.) + (h_s/2.), 0.),
                          ..default()
                      });
                      
                      for left in [true, false] {
                          let s = if left { -1. } else { 1. };
                          m.spawn((SpatialBundle::from_transform(Transform::from_xyz(s * (t_w/2. + l_w/2.), 0.3, 0.)), Limb::Arm { left }))
                          .with_children(|c| {
                              c.spawn(PbrBundle { mesh: mesh.add(Cuboid::new(l_w, l_h, l_d)), material: skin.clone(), transform: Transform::from_xyz(0., -l_h/2. + 0.2, 0.), ..default() });
                          });
                          m.spawn((SpatialBundle::from_transform(Transform::from_xyz(s * (l_w/2. + 0.01), -t_h/2., 0.)), Limb::Leg { left }))
                          .with_children(|c| {
                              c.spawn(PbrBundle { mesh: mesh.add(Cuboid::new(l_w, l_h, l_d)), material: leg_m.clone(), transform: Transform::from_xyz(0., -l_h/2., 0.), ..default() });
                          });
                      }
                  });
              });
          }

          fn touch(touches: Res<Touches>, q_win: Query<&Window, With<PrimaryWindow>>, mut ctrl: ResMut<Controls>) {
              ctrl.move_dir = Vec2::ZERO; ctrl.look = Vec2::ZERO;
              let Ok(w) = q_win.get_single() else { return };
              for t in touches.iter() {
                  if t.position().x < w.width() / 2. {
                      if ctrl.joy_c.is_none() || touches.just_pressed(t.id()) { ctrl.joy_c = Some(t.position()); }
                      ctrl.joy_cur = Some(t.position());
                      ctrl.move_dir = ((t.position() - ctrl.joy_c.unwrap()) / 80.).clamp_length_max(1.0);
                      ctrl.move_dir.y = -ctrl.move_dir.y;
                  } else { ctrl.look += t.delta(); }
              }
              if touches.iter().filter(|t| t.position().x < w.width()/2.).count() == 0 { ctrl.joy_c = None; ctrl.joy_cur = None; }
          }

          fn move_player(time: Res<Time>, ctrl: Res<Controls>, mut q_pl: Query<(&mut Transform, &mut Player)>, mut q_piv: Query<&mut Transform, (With<Pivot>, Without<Player>)>, mut q_mod: Query<&mut Transform, (With<Model>, Without<Player>, Without<Pivot>)>) {
              let Ok(mut piv) = q_piv.get_single_mut() else { return };
              let (y, p, _) = piv.rotation.to_euler(EulerRot::YXZ);
              if ctrl.look != Vec2::ZERO {
                  piv.rotation = Quat::from_euler(EulerRot::YXZ, y - ctrl.look.x * 0.005, (p - ctrl.look.y * 0.005).clamp(-0.8, 0.5), 0.);
              }
              let rot_y = Quat::from_rotation_y(y);
              let dt = time.delta_seconds();
              for (mut pt, mut pl) in q_pl.iter_mut() {
                  let mut dir = rot_y * Vec3::NEG_Z * ctrl.move_dir.y + rot_y * Vec3::X * ctrl.move_dir.x;
                  dir.y = 0.; 
                  if dir.length() > 0.1 { 
                      let d = dir.normalize();
                      pt.translation += d * 7.0 * dt;
                      if let Ok(mut mt) = q_mod.get_single_mut() {
                          mt.rotation = mt.rotation.slerp(Quat::from_rotation_y(f32::atan2(d.x, d.z)), 15. * dt); 
                      }
                      pl.walk += dt * 12.0;
                  } else { pl.walk = 0.; }
              }
          }

          fn animate(q_pl: Query<&Player>, mut q_l: Query<(&Limb, &mut Transform)>) {
              let Ok(pl) = q_pl.get_single() else { return };
              let w = pl.walk.sin() * 0.8;
              for (l, mut t) in q_l.iter_mut() {
                  match l { 
                      Limb::Arm { left } => t.rotation = Quat::from_rotation_x(if *left { -w } else { w }), 
                      Limb::Leg { left } => t.rotation = Quat::from_rotation_x(if *left { w } else { -w }) 
                  }
              }
          }

          fn style(mut ctx: EguiContexts) {
              let mut v = egui::Visuals::dark();
              v.window_fill = egui::Color32::from_rgb(10, 10, 10);
              ctx.ctx_mut().set_visuals(v);
          }

          fn menu(mut ctx: EguiContexts, mut next: ResMut<NextState<GameState>>) {
              egui::CentralPanel::default().show(ctx.ctx_mut(), |ui| {
                  ui.vertical_centered(|ui| {
                      ui.add_space(100.);
                      ui.heading(egui::RichText::new("ENJOER").size(80.).strong().color(egui::Color32::WHITE));
                      ui.add_space(60.);
                      if ui.add_sized([250., 80.], egui::Button::new("PLAY")).clicked() { next.set(GameState::Play); }
                  });
              });
          }

          fn hud(mut ctx: EguiContexts, mut next: ResMut<NextState<GameState>>, ctrl: Res<Controls>, q_win: Query<&Window, With<PrimaryWindow>>) {
              let Ok(win) = q_win.get_single() else { return };
              egui::Area::new(egui::Id::new("h")).fixed_pos(egui::pos2(0., 0.)).show(ctx.ctx_mut(), |ui| {
                  if ui.put(egui::Rect::from_min_size(egui::pos2(20., 20.), egui::vec2(80., 40.)), egui::Button::new("Exit")).clicked() { next.set(GameState::Menu); }
                  let p = ui.painter();
                  if let (Some(c), Some(cur)) = (ctrl.joy_c, ctrl.joy_cur) {
                      p.circle_filled(egui::pos2(c.x, c.y), 60., egui::Color32::from_black_alpha(150));
                      p.circle_filled(egui::pos2(cur.x, cur.y), 25., egui::Color32::WHITE);
                  }
              });
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup NDK/SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "platforms;android-30" "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          work-dir: enjoer_game

      - name: Build APK
        run: |
          cargo install cargo-apk
          cd enjoer_game
          export ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/25.2.9519653
          export ANDROID_HOME=${ANDROID_HOME}
          export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
          cargo apk build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: Enjoer-Game-APK, path: enjoer_game/target/release/apk/*.apk }
