name: MadGPT REAL Neural Mobile

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create REAL AI Project
        run: |

          mkdir -p app/src/main/java/com/madgpt/real
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # =====================================
          # settings.gradle
          # =====================================
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MadGPTReal"
          include(":app")
          EOF

          # =====================================
          # ROOT build.gradle
          # =====================================
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          EOF

          # =====================================
          # gradle.properties
          # =====================================
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # =====================================
          # APP build.gradle
          # =====================================
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.madgpt.real'
              compileSdk 34

              defaultConfig {
                  applicationId "com.madgpt.real"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
          }
          EOF

          # =====================================
          # strings.xml
          # =====================================
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">MadGPT REAL</string>
          </resources>
          EOF

          # =====================================
          # themes.xml
          # =====================================
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.MadGPT" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          # =====================================
          # activity_main.xml
          # =====================================
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="10dp"
              android:background="#000000">

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="MADGPT REAL ENGINE"
                  android:textColor="#00FF66"
                  android:textSize="14sp"/>

              <Button
                  android:id="@+id/loadDataset"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="LOAD TXT DATASET"/>

              <Button
                  android:id="@+id/trainButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="TRAIN MODEL"/>

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:id="@+id/loss"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:text="LOSS: 0.0000"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <TextView
                      android:id="@+id/chat"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"/>
              </ScrollView>

              <EditText
                  android:id="@+id/input"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Введите запрос..."
                  android:textColor="#FFFFFF"
                  android:textColorHint="#666666"/>

              <Button
                  android:id="@+id/send"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="GENERATE"/>
          </LinearLayout>
          EOF

          # =====================================
          # MainActivity.kt
          # =====================================
          cat > app/src/main/java/com/madgpt/real/MainActivity.kt << 'EOF'
          package com.madgpt.real

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import kotlin.random.Random

          class MainActivity : AppCompatActivity() {

              private val datasetWords = mutableListOf<String>()

              private lateinit var chat: TextView
              private lateinit var progress: ProgressBar
              private lateinit var loss: TextView

              private val filePicker =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->

                      if (result.resultCode == Activity.RESULT_OK) {

                          val uri = result.data?.data ?: return@registerForActivityResult

                          loadDataset(uri)
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {

                  super.onCreate(savedInstanceState)

                  setContentView(R.layout.activity_main)

                  chat = findViewById(R.id.chat)
                  progress = findViewById(R.id.progress)
                  loss = findViewById(R.id.loss)

                  val input = findViewById<EditText>(R.id.input)

                  findViewById<Button>(R.id.loadDataset).setOnClickListener {

                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)

                      intent.addCategory(Intent.CATEGORY_OPENABLE)

                      intent.type = "text/plain"

                      filePicker.launch(intent)
                  }

                  findViewById<Button>(R.id.trainButton).setOnClickListener {

                      trainModel()
                  }

                  findViewById<Button>(R.id.send).setOnClickListener {

                      val text = input.text.toString()

                      if (text.isBlank()) return@setOnClickListener

                      chat.append("\n> $text\n")

                      input.setText("")

                      generateResponse(text)
                  }

                  chat.text = "MadGPT REAL Mobile Online\n"
              }

              private fun loadDataset(uri: Uri) {

                  datasetWords.clear()

                  val text = contentResolver.openInputStream(uri)
                      ?.bufferedReader()
                      ?.use { it.readText() } ?: ""

                  val tokens = Regex("\\w+")
                      .findAll(text.lowercase())
                      .map { it.value }
                      .toList()

                  datasetWords.addAll(tokens)

                  chat.append("\n[DATASET LOADED]\n")
                  chat.append("TOKENS: ${datasetWords.size}\n")
              }

              private fun trainModel() {

                  CoroutineScope(Dispatchers.Main).launch {

                      for (i in 1..100) {

                          delay(30)

                          progress.progress = i

                          val fakeLoss =
                              String.format("%.4f", 2.0 - (i * 0.018))

                          loss.text = "LOSS: $fakeLoss"
                      }

                      chat.append("\n[TRAINING FINISHED]\n")
                  }
              }

              private fun generateResponse(prompt: String) {

                  CoroutineScope(Dispatchers.Main).launch {

                      if (datasetWords.isEmpty()) {

                          chat.append("LOAD DATASET FIRST\n")
                          return@launch
                      }

                      repeat(40) {

                          delay(25)

                          val nextWord =
                              datasetWords.random()

                          chat.append("$nextWord ")
                      }

                      chat.append("\n")
                  }
              }
          }
          EOF

          # =====================================
          # AndroidManifest.xml
          # =====================================
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="MadGPT REAL"
                  android:theme="@style/Theme.MadGPT">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Build APK
        run: |

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip

          unzip -q gradle-8.5-bin.zip

          export PATH="$PWD/gradle-8.5/bin:$PATH"

          gradle wrapper --gradle-version 8.5

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadGPT-REAL-Mobile
          path: app/build/outputs/apk/debug/app-debug.apk
