name: Build Enjoer game APK

on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      # The host build uses clang at -O3 too, so the tests exercise the same
      # compiler and optimisation level as the shipping library.
      - name: Install clang
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version

      - name: Run DimScript and native regression tests
        env:
          CC: clang
          CXX: clang++
        run: |
          set -o pipefail
          if ! tools/tests/run.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
            python3 tools/ci/annotate.py "$RUNNER_TEMP/tests.log"
            exit 1
          fi

      - name: Validate and pack the game
        run: |
          set -eu
          # The manifest goes outside the packaging root: aapt would otherwise
          # also try to store staging/AndroidManifest.xml as a file.
          python3 tools/gamepack.py game --staging staging \
            --manifest-out apk-manifest/AndroidManifest.xml
          test -f staging/assets/game/game.manifest
          test -f staging/assets/game/main.ds
          test -f staging/assets/game/battle.ds
          test -f staging/assets/game/ui.ds
          test -f apk-manifest/AndroidManifest.xml
          grep -q 'package="com.cb4.cubicbattle"' apk-manifest/AndroidManifest.xml
          grep -q 'android:label="Cubic Battle 4"' apk-manifest/AndroidManifest.xml

      # Vulkan comes with the NDK, so the CI APK is the real GPU build.
      - name: Build native library
        run: |
          set -eu
          # The log is captured so a failure can be reported as annotations:
          # job logs are served from a host that not every runner can read.
          set -o pipefail
          if ! cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_NDK=$ANDROID_NDK_ROOT \
            -DCMAKE_BUILD_TYPE=Release \
            -DENJOER_USE_VULKAN=ON \
            -DENJOER_GAME_DIR=game 2>&1 | tee "$RUNNER_TEMP/cmake.log"; then
            python3 tools/ci/annotate.py "$RUNNER_TEMP/cmake.log"
            exit 1
          fi
          if ! cmake --build build-arm64 -j 2>&1 | tee -a "$RUNNER_TEMP/cmake.log"; then
            python3 tools/ci/annotate.py "$RUNNER_TEMP/cmake.log" --context 1
            exit 1
          fi
          mkdir -p staging/lib/arm64-v8a
          cp build-arm64/libds_game.so staging/lib/arm64-v8a/

      - name: Compile Java activity
        run: |
          set -eu
          mkdir -p build-java
          javac -source 8 -target 8 \
            -classpath $ANDROID_HOME/platforms/android-34/android.jar \
            -d build-java \
            game/java/com/cb4/GameActivity.java
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --lib $ANDROID_HOME/platforms/android-34/android.jar \
            --output staging \
            $(find build-java -name '*.class')

      - name: Package APK
        run: |
          set -eu
          set -o pipefail
          BT=$ANDROID_HOME/build-tools/34.0.0
          if ! $BT/aapt package -f \
            -M apk-manifest/AndroidManifest.xml \
            -I $ANDROID_HOME/platforms/android-34/android.jar \
            -F unsigned.apk \
            staging/ 2>&1 | tee "$RUNNER_TEMP/aapt.log"; then
            python3 tools/ci/annotate.py "$RUNNER_TEMP/aapt.log"
            exit 1
          fi
          $BT/zipalign -v 4 unsigned.apk aligned.apk
          keytool -genkey -v \
            -keystore d.ks \
            -storepass android \
            -alias a \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Enjoer"
          $BT/apksigner sign \
            --ks d.ks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out EnjoerCube.apk \
            aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Enjoer-Cube-APK
          path: EnjoerCube.apk
