<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DimScript — Vulkan game preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a32;overscroll-behavior:none}
.game{position:fixed;inset:0;display:grid;place-items:center}
canvas{display:block;touch-action:none;user-select:none;outline:none;cursor:grab;image-rendering:auto}
canvas:active{cursor:grabbing}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font:14px system-ui,sans-serif;color:#d9e7ff;opacity:.8;pointer-events:none;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<main class="game"><canvas id="c" tabindex="0" aria-label="Enjoer 3D cube preview. Drag to orbit. Use arrow keys or WASD to look, Space reverses the spin, R resets."></canvas></main>
<div class="hint">drag to orbit · touch runs DimScript · arrows / WASD · space reverses spin · R resets · fontless</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=960,H=540;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
fetch('/info').then(r=>r.json()).then(async info=>{W=info.w;H=info.h;cv.width=W;cv.height=H;fit();await fetch('/event',{method:'POST',body:'t=cancel'});loop()});
let nextFrame=null;
async function requestFrame(){try{const r=await fetch('/frame.jpg',{cache:'no-store'});return r.ok?await r.blob():null}catch(e){return null}}
async function loop(){try{if(!document.hidden){const blob=await(nextFrame||requestFrame());nextFrame=null;if(!document.hidden){nextFrame=requestFrame();if(blob){const image=await createImageBitmap(blob);ctx.drawImage(image,0,0);image.close()}}}else nextFrame=null}catch(e){}requestAnimationFrame(loop)}
const queue=[];let sending=false;
function ev(body){if(body.t==='move'){for(let i=queue.length-1;i>=0&&queue[i].t==='move';i--)if(queue[i].id===body.id){queue[i]=body;return}}queue.push(body);flush()}
async function flush(){if(sending||!queue.length)return;sending=true;const batch=queue.splice(0,64);try{await fetch('/event',{method:'POST',body:batch.map(x=>new URLSearchParams(x)).join('\n'),keepalive:true})}catch(e){queue.length=0;queue.push({t:'cancel'})}finally{sending=false;if(queue.length)flush()}}
function point(e){const r=cv.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)*W/r.width),y:Math.round((e.clientY-r.top)*H/r.height)}}
const active=new Set(),keys=new Map();
function down(e){cv.focus({preventScroll:true});active.add(e.pointerId);cv.setPointerCapture(e.pointerId);ev({t:'down',id:e.pointerId,...point(e)})}
cv.addEventListener('pointerdown',e=>{down(e);e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(active.has(e.pointerId)){ev({t:'move',id:e.pointerId,...point(e)});e.preventDefault()}});
cv.addEventListener('pointerup',e=>{if(active.delete(e.pointerId))ev({t:'up',id:e.pointerId,...point(e)})});
function cancel(e){if(active.delete(e.pointerId))ev({t:'cancel-pointer',id:e.pointerId,...point(e)})}
cv.addEventListener('pointercancel',cancel);cv.addEventListener('lostpointercapture',cancel);cv.addEventListener('contextmenu',e=>e.preventDefault());
const map={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',Space:'space',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',KeyR:'r'};
addEventListener('keydown',e=>{const k=map[e.code];if(!k||e.ctrlKey||e.metaKey||e.altKey)return;e.preventDefault();if(e.repeat||keys.has(e.code))return;keys.set(e.code,k);ev({t:'key',k,d:1})});
addEventListener('keyup',e=>{const k=keys.get(e.code);if(!k)return;keys.delete(e.code);e.preventDefault();ev({t:'key',k,d:0})});
function release(){active.clear();keys.clear();queue.length=0;ev({t:'cancel'})}
addEventListener('blur',release);addEventListener('resize',()=>{release();fit()});document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
</script>
</body>
</html>
